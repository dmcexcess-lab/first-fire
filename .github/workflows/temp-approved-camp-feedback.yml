name: Temporary approved camp feedback patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-approved-camp-feedback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch approved camp feedback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('game/scripts/MainSleepVirus.gd')
          text = main_path.read_text()

          old = '''var gate_zone_names: Array = []\nvar gate_zone_index := 0\n'''
          new = '''var gate_zone_names: Array = []\nvar gate_zone_index := 0\nvar expedition_return_notice: Button\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    _hide_development_placeholder()\n    _apply_camp_menu_layout()\n'''
          new = '''    _hide_development_placeholder()\n    _apply_camp_menu_layout()\n    _build_expedition_return_notice()\n    if not Game.toast_requested.is_connected(_on_return_toast):\n        Game.toast_requested.connect(_on_return_toast)\n'''
          assert old in text
          text = text.replace(old, new, 1)

          needle = '''func _build_inspector_overlay():\n'''
          insert = '''func _build_expedition_return_notice() -> void:\n    expedition_return_notice = Button.new()\n    expedition_return_notice.visible = false\n    expedition_return_notice.z_index = 50\n    expedition_return_notice.set_anchors_preset(Control.PRESET_BOTTOM_WIDE)\n    expedition_return_notice.offset_left = 14.0\n    expedition_return_notice.offset_right = -14.0\n    expedition_return_notice.offset_top = -90.0\n    expedition_return_notice.offset_bottom = -14.0\n    expedition_return_notice.custom_minimum_size = Vector2(0, 68)\n    expedition_return_notice.autowrap_mode = TextServer.AUTOWRAP_WORD_SMART\n    expedition_return_notice.add_theme_font_size_override("font_size", 13)\n    expedition_return_notice.pressed.connect(_dismiss_return_notice)\n    add_child(expedition_return_notice)\n\nfunc _on_return_toast(message) -> void:\n    if expedition_return_notice == null:\n        return\n    var source := str(message)\n    var lower := source.to_lower()\n    var marker := " returned: "\n    var marker_index := lower.find(marker)\n    var display := ""\n    if marker_index >= 0:\n        var who := source.substr(0, marker_index)\n        var haul := source.substr(marker_index + marker.length())\n        display = "%s RETURNED\\n%s" % [who.to_upper(), haul]\n    elif lower.ends_with(" returned empty-handed."):\n        var suffix := " returned empty-handed."\n        var who := source.substr(0, source.length() - suffix.length())\n        display = "%s RETURNED\\nEmpty-handed" % who.to_upper()\n    else:\n        return\n    expedition_return_notice.text = display + "  •  TAP TO DISMISS"\n    expedition_return_notice.visible = true\n\nfunc _dismiss_return_notice() -> void:\n    if expedition_return_notice != null:\n        expedition_return_notice.visible = false\n\n'''
          assert needle in text
          text = text.replace(needle, insert + needle, 1)

          old = '''        v.add_child(_make_label(desc, 12))\n        var req_ok := true\n'''
          new = '''        v.add_child(_make_label(desc, 12))\n        var missing_text := _craft_missing_text(recipe)\n        if missing_text != "":\n            var missing_label: Label = _make_label("Missing: " + missing_text, 12)\n            missing_label.modulate = Color(0.95, 0.67, 0.43, 1.0)\n            v.add_child(missing_label)\n        var req_ok := true\n'''
          assert old in text
          text = text.replace(old, new, 1)

          needle = '''func _draw_building_context(building_name: String) -> void:\n'''
          insert = '''func _craft_missing_text(recipe: Dictionary) -> String:\n    var missing: Array = []\n    var resource_cost: Dictionary = recipe.get("cost", {})\n    for key_value in resource_cost.keys():\n        var key := str(key_value)\n        var needed := int(resource_cost[key_value])\n        var have := int(Game.resources.get(key, 0))\n        if have < needed:\n            missing.append("%s %d/%d" % [key, have, needed])\n    var component_cost: Dictionary = recipe.get("component_cost", {})\n    for key_value in component_cost.keys():\n        var key := str(key_value)\n        var needed := int(component_cost[key_value])\n        var have := int(Game.components.get(key, 0))\n        if have < needed:\n            missing.append("%s %d/%d" % [key, have, needed])\n    return ", ".join(missing)\n\n'''
          assert needle in text
          text = text.replace(needle, insert + needle, 1)

          old = '''    if Game.start_expedition(survivor_id, zone):\n        _close_camp_context()\n'''
          new = '''    if Game.start_expedition(survivor_id, zone):\n        _dismiss_return_notice()\n        _close_camp_context()\n'''
          assert old in text
          text = text.replace(old, new, 1)

          start = text.index('func _refresh_status():\n')
          end = text.index('func _draw_camp_work_board() -> void:\n', start)
          new_status = '''func _refresh_status():\n    if status_label == null:\n        return\n    status_label.text = "D%d  %s  •  FOOD %d  WATER %d" % [\n        Game.day,\n        Game.formatted_time(),\n        int(Game.resources.get("Cooked Food", 0)),\n        int(Game.resources.get("Clean Water", 0)),\n    ]\n    pause_button.text = "PAUSE"\n    var active: Array = []\n    for exp in Game.expeditions:\n        var names := Game._party_names(exp["survivor_ids"])\n        var zone := str(exp.get("zone", ""))\n        if exp.get("state", "") == "traveling":\n            active.append("AWAY • %s • %s • %.0fs" % [names, zone, float(exp["remaining"])])\n        elif exp.get("state", "") == "pending":\n            active.append("AWAY • %s • %s • DECISION" % [names, zone])\n        elif exp.get("state", "") == "combat":\n            active.append("TACTICAL • %s • %s" % [names, zone])\n    for s in Game.survivors:\n        var status := str(s.get("status", ""))\n        if status in ["Crafting", "Building", "Recovering", "Tending", "Sleeping"] and not s.get("task", {}).is_empty():\n            var task: Dictionary = s["task"]\n            var label := "virus care" if str(task.get("kind", "")) == "virus_treatment" else status.to_lower()\n            active.append("%s %s: %.0fs" % [s["name"], label, float(task.get("remaining", 0.0))])\n        elif status in ["Chore", "Pet Care"] and not s.get("task", {}).is_empty():\n            active.append("%s %s %d/%d" % [s["name"], s["task"].get("label", "work"), int(s["task"].get("progress", 0)), int(s["task"].get("goal", 1))])\n        elif status in ["Quarantined", "Sick"]:\n            active.append("%s: %s" % [s["name"], _activity_text(s)])\n    var timer_text := "PAUSED" if Game.sim_paused else ""\n    if not active.is_empty():\n        timer_text += ("  •  " if timer_text != "" else "") + "  |  ".join(active)\n    timer_label.text = timer_text\n    timer_label.visible = timer_text != ""\n\n'''
          text = text[:start] + new_status + text[end:]
          main_path.write_text(text)

          camp_path = Path('game/scripts/FFCampViewSleepVirus.gd')
          camp = camp_path.read_text()
          old = '''    draw_string(font, title_origin, "FIRST FIRE CAMP  •  %s  •  %s" % [Game.formatted_time(), _day_phase()], HORIZONTAL_ALIGNMENT_LEFT, -1.0, title_size, Color(0.94, 0.94, 0.86, 0.95))\n'''
          new = '''    draw_string(font, title_origin, "FIRST FIRE CAMP  •  DAY %d" % Game.day, HORIZONTAL_ALIGNMENT_LEFT, -1.0, title_size, Color(0.94, 0.94, 0.86, 0.95))\n'''
          assert old in camp
          camp_path.write_text(camp.replace(old, new, 1))

          context_path = Path('README_CONTEXT.md')
          context = context_path.read_text()
          old = '''The First Fire is guaranteed from a new game and therefore serves as the default crafting system before any construction. Its current recipes are Cook Food, Boil Water, and Sterile Dressing. Later crafting depth is unlocked physically by building the Workbench and Sewing Table rather than by unlocking a separate Craft screen.\n'''
          new = old + '''Crafting cards show explicit owned/required shortages (for example `Raw Food 0/1`) when a recipe cannot be paid, so a disabled action explains itself without requiring a stash detour.\n\nThe top camp HUD is the authoritative clock/resource readout. The map title stays intentionally short (`FIRST FIRE CAMP • DAY N`), the idle `RUNNING` label is hidden, and the secondary status line only appears for meaningful states such as an away survivor, tactical encounter, active work, illness, or pause. Routine expedition returns are promoted from transient toast text into a persistent tap-to-dismiss camp return notice carrying the exact haul/empty-handed result.\n'''
          assert old in context
          context_path.write_text(context.replace(old, new, 1))

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          entry = '''## Beta Candidate — Camp Return & Crafting Feedback — 2026-09-14\n\n- Routine expedition returns now produce a persistent tap-to-dismiss camp notice with the survivor and exact haul (or empty-handed result), instead of relying only on a transient toast.\n- Simplified the camp header: the in-world title now shows only `FIRST FIRE CAMP • DAY N`; the top HUD remains the clock/resource source, idle `RUNNING` is hidden, and the activity line appears only for useful away/work/pause states.\n- Disabled crafting recipes now state the exact missing resource/component counts such as `Raw Food 0/1` or `Sterile Dressing 0/1`.\n\n'''
          changelog_path.write_text(entry + changelog)
          PY
          git config user.name "dmcexcess-lab"
          git config user.email "dmcexcess@gmail.com"
          git add game/scripts/MainSleepVirus.gd game/scripts/FFCampViewSleepVirus.gd README_CONTEXT.md CHANGELOG.md
          git diff --cached --check
          git commit -m "Improve camp return and crafting feedback"
          git push origin HEAD:main
