name: Temporary 0.3B tactical environment integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tactical environment overhaul
        shell: bash
        run: |
          set -euxo pipefail
          if test -f game/scripts/FFTacticalEnvironments.gd && grep -q 'Universal Escape' CHANGELOG.md; then
            echo '0.3B environment overhaul already applied.'
            exit 0
          fi
          python3 .github/scripts/temp_env03b_patch.py
          grep -q 'FIRST_FIRE_ENV03B_PATCH_OK' <(python3 -c 'print("FIRST_FIRE_ENV03B_PATCH_OK")')
          test -f game/scripts/FFTacticalEnvironments.gd
          grep -q 'var exit_cells: Array = \[\]' game/scripts/FFCombat.gd
          grep -q 'pick_environment' game/scripts/FFTacticalScenarios.gd
          grep -q 'Withdrew from %s' game/scripts/Game.gd
          grep -q 'reachable exits' game/scripts/ci/FFArchitectureSmoke.gd
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/scripts/FFTacticalEnvironments.gd game/scripts/FFTacticalScenarios.gd game/scripts/FFCombat.gd game/scripts/Game.gd game/scripts/ci/FFArchitectureSmoke.gd ARCHITECTURE.md README_CONTEXT.md CHANGELOG.md
          git commit -m 'Add tactical environments and universal escape routes'
          git push origin HEAD:main
