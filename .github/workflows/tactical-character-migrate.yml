name: Temporary tactical character integration

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tactical-character-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate Alpha 0.3A character graphics
        shell: bash
        run: |
          set -euxo pipefail
          python3 .tmp/tactical_character_migrate.py

          # The Actions token may update normal source/docs but cannot modify
          # workflow definitions. The permanent Pages gate is updated separately
          # through the repository connector after this source integration lands.
          git checkout -- .github/workflows/pages.yml

          git diff --check
          grep -q 'const SAVE_SCHEMA_VERSION := 4' game/scripts/Game.gd
          grep -q 'TacticalVisuals.draw_survivor' game/scripts/FFCombat.gd
          grep -q 'class_name FFTacticalVisuals' game/scripts/FFTacticalVisuals.gd

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game README_SOPS.md README_CONTEXT.md ARCHITECTURE.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No character integration changes needed."
            exit 0
          fi
          git commit -m "Implement tactical character graphics 0.3A"
          git push origin HEAD:main
