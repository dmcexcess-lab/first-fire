name: Temporary beta parse fix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/temp_beta_fix.py'
      - '.github/scripts/temp_beta_fix_trigger.txt'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply parse fix
        run: python3 .github/scripts/temp_beta_fix.py
      - name: Commit fix only
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/scripts/temp_beta_fix.py .github/scripts/temp_beta_fix_trigger.txt
          git add -A
          git commit -m "Fix beta candidate treatment typing"
          git push origin HEAD:main
