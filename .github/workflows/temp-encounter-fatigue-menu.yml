name: Temporary encounter fatigue menu integration

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temporary-encounter-fatigue-menu-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply encounter fatigue menu tuning
        shell: bash
        run: |
          set -euxo pipefail
          python3 .tmp/apply_tuning.py
          git diff --check
          grep -q 'TACTICAL_EVENT_CHANCE' game/scripts/FFExpeditionRules.gd
          grep -q 'should_trigger_tactical_event' game/scripts/Game.gd
          grep -q 'FATIGUE_GAIN_MULTIPLIER := 2.0' game/scripts/FFCampLifeRules.gd
          grep -q 'CampLifeRules.fatigue_gain' game/scripts/Game.gd
          grep -q 'MAIN_MENU_BG := "res://assets/menu_bg.jpg"' game/scripts/Main.gd
          test ! -e .tmp/apply_tuning.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/scripts README_CONTEXT.md CHANGELOG.md
          git add -u .tmp || true
          if git diff --cached --quiet; then
            echo "No tuning changes needed."
            exit 0
          fi
          git commit -m "Tune tactical encounters fatigue and menu art hookup"
          git push origin HEAD:main
