name: Temporary tactical 0.3D integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tactical senses timing art pass
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'Alpha 0.3D — Tactical Senses, Timing & Art' CHANGELOG.md; then
            echo '0.3D already integrated.'
            exit 0
          fi
          python3 .github/scripts/temp_tactical03d_patch.py | tee /tmp/tactical03d.log
          grep -q 'FIRST_FIRE_TACTICAL_03D_PATCH_OK' /tmp/tactical03d.log
          grep -q 'const SAVE_SCHEMA_VERSION := 5' game/scripts/Game.gd
          grep -q 'var scene_time := "day"' game/scripts/FFCombat.gd
          grep -q 'TacticalTime.movement_cost' game/scripts/FFCombat.gd
          grep -q 'TacticalSound.estimate_location' game/scripts/FFCombat.gd
          grep -q 'TacticalTiles.draw_ground' game/scripts/FFCombat.gd
          grep -q '"Headlamp": {"slot": "Secondary"' game/scripts/FFData.gd
          grep -q '"indoor_rects": \[\]' game/scripts/FFTacticalEnvironments.gd
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/scripts/FFData.gd game/scripts/Game.gd game/scripts/FFInspector.gd game/scripts/FFTacticalEnvironments.gd game/scripts/FFCombat.gd game/scripts/ci/FFArchitectureSmoke.gd ARCHITECTURE.md README_CONTEXT.md README_SOPS.md CHANGELOG.md
          git commit -m 'Deepen tactical senses timing and art systems'
          git push origin HEAD:main
