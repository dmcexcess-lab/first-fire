name: Temporary tactical depth type fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply explicit tactical vector types
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'var target: Vector2i = player.pos + player.facing' game/scripts/FFCombat.gd; then
            echo 'Type fix already applied.'
            exit 0
          fi
          python3 .github/scripts/temp_tactical_depth_type_fix.py | tee /tmp/tactical-depth-type.log
          grep -q 'FIRST_FIRE_TACTICAL_DEPTH_TYPE_FIX_OK' /tmp/tactical-depth-type.log
          grep -q 'var diff: Vector2i = target - player.pos' game/scripts/FFCombat.gd
          grep -q 'var between: Vector2i = player.pos + dir \* step' game/scripts/FFCombat.gd
          grep -q 'var target: Vector2i = player.pos + player.facing' game/scripts/FFCombat.gd
          test ! -e .github/scripts/temp_tactical_depth_type_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/scripts/FFCombat.gd .github/scripts/temp_tactical_depth_type_fix.py
          git commit -m 'Fix tactical depth vector inference'
          git push origin HEAD:main
