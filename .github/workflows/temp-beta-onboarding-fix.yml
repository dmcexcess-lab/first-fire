name: Temporary Beta onboarding fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply onboarding and worker picker fix
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'Beta Candidate — Onboarding & Worker Picker Fix' CHANGELOG.md; then
            echo 'Fix already applied.'
            exit 0
          fi
          python3 .github/scripts/temp_beta_onboarding_fix.py | tee /tmp/onboarding-fix.log
          grep -q 'FIRST_FIRE_BETA_ONBOARDING_FIX_OK' /tmp/onboarding-fix.log
          grep -q 'const TUTORIAL_STEPS' game/scripts/Main.gd
          grep -q 'func _on_worker_cycle' game/scripts/Main.gd
          if grep -q 'option.item_selected.connect(_on_worker_selected' game/scripts/Main.gd; then exit 1; fi
          grep -q 'func tutorial_needed' game/scripts/Game.gd
          grep -q '"tutorial_complete": false' game/scripts/Game.gd
          test ! -e .github/scripts/temp_beta_onboarding_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/scripts/Main.gd game/scripts/Game.gd game/scripts/ci/FFArchitectureSmoke.gd CHANGELOG.md .github/scripts/temp_beta_onboarding_fix.py
          git commit -m 'Fix worker selection and add new-save tutorial'
          git push origin HEAD:main
