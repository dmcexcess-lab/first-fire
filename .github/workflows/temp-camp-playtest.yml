name: Temporary camp gameplay playtest

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-camp-playtest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Exercise live camp interactions
        run: |
          cat > playtest.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('qa', { recursive: true });
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const logs=[];
          page.on('console', m=>logs.push(`console:${m.type()}:${m.text()}`));
          page.on('pageerror', e=>logs.push(`pageerror:${e.message}`));
          await page.goto('https://dmcexcess-lab.github.io/first-fire/', {waitUntil:'load',timeout:120000});
          await page.waitForTimeout(9000);
          const canvas=page.locator('canvas').first();
          if(!(await canvas.boundingBox())) throw new Error('canvas missing');
          async function shot(name){await page.screenshot({path:`qa/${name}.png`,fullPage:true});}
          async function clickGame(x,y,w=700){const b=await canvas.boundingBox();await page.mouse.click(b.x+(x/390)*b.width,b.y+(y/844)*b.height);await page.waitForTimeout(w);}
          await clickGame(195,354,1000); // NEW GAME
          await clickGame(93,524,900);   // SKIP
          await shot('01_home');
          await clickGame(159,452,700);  // First Fire
          await shot('02_fire_crafting');
          await clickGame(111,217,700);  // Work board while contextual camp is compact
          await shot('03_work_board');
          await clickGame(183,289,700);  // Stash
          await shot('04_stash');
          await clickGame(333,44,700);   // Inspector CLOSE
          await clickGame(62,289,700);   // Makeshift Shelter plot
          await shot('05_build_plot');
          await clickGame(171,385,700);  // Gate
          await shot('06_gate');
          await clickGame(183,241,700);  // Founder in compact camp
          await shot('07_survivor_inspector');
          await clickGame(333,44,700);   // close inspector
          fs.writeFileSync('qa/console.txt',logs.join('\n'));
          await browser.close();
          EOF
          node playtest.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp-playtest-stage2
          path: qa
          retention-days: 1
