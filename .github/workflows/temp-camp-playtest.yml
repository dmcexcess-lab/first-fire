name: Temporary camp gameplay playtest

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-camp-playtest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Exercise camp work and send-out entry
        run: |
          cat > playtest.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('qa', { recursive: true });
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const logs=[];
          page.on('console', m=>logs.push(`console:${m.type()}:${m.text()}`));
          page.on('pageerror', e=>logs.push(`pageerror:${e.message}`));
          await page.goto('https://dmcexcess-lab.github.io/first-fire/', {waitUntil:'load',timeout:120000});
          await page.waitForTimeout(9000);
          const canvas=page.locator('canvas').first();
          if(!(await canvas.boundingBox())) throw new Error('canvas missing');
          async function shot(name){await page.screenshot({path:`qa/${name}.png`,fullPage:true});}
          async function clickGame(x,y,w=700){const b=await canvas.boundingBox();await page.mouse.click(b.x+(x/390)*b.width,b.y+(y/844)*b.height);await page.waitForTimeout(w);}
          async function wheel(dy){const b=await canvas.boundingBox();await page.mouse.move(b.x+b.width*0.5,b.y+b.height*0.82);await page.mouse.wheel(0,dy);await page.waitForTimeout(700);}
          await clickGame(195,354,1000); // NEW GAME
          await clickGame(93,524,900);   // SKIP
          await shot('01_home');
          await clickGame(111,428,700);  // physical work board on full camp
          await shot('02_work_board_top');
          await wheel(520);
          await shot('03_work_board_scrolled');
          await clickGame(195,469,700);  // CAMP back
          await shot('04_home_again');
          await clickGame(183,452,700);  // founder
          await shot('05_survivor');
          await clickGame(285,661,800);  // SEND OUT from inspector
          await shot('06_expedition_setup');
          fs.writeFileSync('qa/console.txt',logs.join('\n'));
          await browser.close();
          EOF
          node playtest.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp-playtest-stage3
          path: qa
          retention-days: 1
