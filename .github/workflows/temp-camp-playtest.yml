name: Temporary camp gameplay playtest

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-camp-playtest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 pngjs@7.0.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Drive live expeditions into tactical
        run: |
          cat > playtest.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { PNG } from 'pngjs';
          import fs from 'fs';
          fs.mkdirSync('qa', { recursive: true });
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const logs=[];
          page.on('console', m=>logs.push(`console:${m.type()}:${m.text()}`));
          page.on('pageerror', e=>logs.push(`pageerror:${e.message}`));
          await page.goto('https://dmcexcess-lab.github.io/first-fire/', {waitUntil:'load',timeout:120000});
          await page.waitForTimeout(9000);
          const canvas=page.locator('canvas').first();
          if(!(await canvas.boundingBox())) throw new Error('canvas missing');
          async function shot(name){await page.screenshot({path:`qa/${name}.png`,fullPage:true});}
          async function clickGame(x,y,w=700){const b=await canvas.boundingBox();await page.mouse.click(b.x+(x/390)*b.width,b.y+(y/844)*b.height);await page.waitForTimeout(w);}
          async function tacticalState(){const png=PNG.sync.read(await canvas.screenshot()); const x=10,y=649,i=(y*png.width+x)*4; const rgb=[png.data[i],png.data[i+1],png.data[i+2]]; logs.push(`tactical_sample:${rgb.join(',')}`); return rgb[0]>45&&rgb[1]>45&&rgb[2]>45;}
          async function dispatch(n){
            await clickGame(171,597,700); // physical gate cell, not just its floating label
            await shot(`0${n}_gate`);
            await clickGame(285,620,700); // first survivor SEND OUT
            await shot(`0${n}_setup`);
            await clickGame(195,467,700); // SEND expedition
            await page.waitForTimeout(22000);
            await shot(`0${n}_result`);
          }
          await clickGame(195,354,1000); // NEW GAME
          await clickGame(93,524,900);   // SKIP
          let tactical=false;
          for(let n=1;n<=3 && !tactical;n++){
            await dispatch(n);
            tactical=await tacticalState();
            logs.push(`tactical_after_${n}:${tactical}`);
          }
          if(tactical){
            await shot('10_tactical_initial');
            await page.keyboard.press('c'); await page.waitForTimeout(500); await shot('11_crouch');
            await page.keyboard.press('c'); await page.waitForTimeout(300);
            await page.keyboard.press('Shift'); await page.waitForTimeout(500); await shot('12_sprint');
            await page.keyboard.press('w'); await page.waitForTimeout(500); await shot('13_sprint_forward');
            await page.keyboard.press('Shift'); await page.waitForTimeout(300);
            await page.keyboard.press('e'); await page.waitForTimeout(300);
            await page.keyboard.press('w'); await page.waitForTimeout(500); await shot('14_walk_forward');
            await page.keyboard.press('l'); await page.waitForTimeout(500); await shot('15_light_off');
            await page.keyboard.press('l'); await page.waitForTimeout(300);
          } else {
            logs.push('NO_TACTICAL_REACHED');
          }
          fs.writeFileSync('qa/console.txt',logs.join('\n'));
          await browser.close();
          EOF
          node playtest.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp-playtest-stage5
          path: qa
          retention-days: 1
