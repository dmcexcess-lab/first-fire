name: Temporary 0.3C tactical lighting integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tactical lighting overhaul
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'Alpha 0.3C — Tactical Lighting & Secondary Gear' CHANGELOG.md; then
            echo '0.3C lighting overhaul already applied.'
            exit 0
          fi
          python3 .github/scripts/temp_lighting03c_patch.py | tee /tmp/lighting03c-patch.log
          grep -q 'FIRST_FIRE_LIGHTING_03C_PATCH_OK' /tmp/lighting03c-patch.log
          test -f game/scripts/FFTacticalLighting.gd
          grep -q '"Flashlight": {"slot": "Secondary"' game/scripts/FFData.gd
          grep -q 'var light_sources: Array = \[\]' game/scripts/FFCombat.gd
          grep -q 'TacticalLighting.cone_contribution' game/scripts/FFCombat.gd
          grep -q '"lights": \[\]' game/scripts/FFTacticalEnvironments.gd
          grep -q 'flashlight secondary slot' game/scripts/ci/FFArchitectureSmoke.gd
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/scripts/FFData.gd game/scripts/FFInspector.gd game/scripts/FFTacticalEnvironments.gd game/scripts/FFTacticalLighting.gd game/scripts/FFCombat.gd game/scripts/ci/FFArchitectureSmoke.gd ARCHITECTURE.md README_SOPS.md README_CONTEXT.md CHANGELOG.md
          git commit -m 'Add tactical lighting and secondary gear slot'
          git push origin HEAD:main
