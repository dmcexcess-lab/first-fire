name: Temporary tactical light toggle integration
on:
  push:
    paths:
      - '.github/workflows/temp-light-toggle.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and remove temporary integration
        run: |
          set -euxo pipefail
          python3 .github/scripts/temp_light_toggle_patch.py
          git config user.name 'dmcexcess-lab'
          git config user.email 'dmcexcess@gmail.com'
          git add -A
          git commit -m 'Add tactical portable light control'
          git push origin HEAD:main
