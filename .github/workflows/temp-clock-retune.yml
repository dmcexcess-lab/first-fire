name: Temporary settlement clock retune

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-clock-retune.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retune settlement clock
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('game/scripts/GameSleepVirus.gd')
          s = p.read_text()
          old = 'const SIM_TIME_SCALE := 0.5\n'
          new = 'const SIM_TIME_SCALE := 1.0\n'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('README_CONTEXT.md')
          s = p.read_text()
          start = s.index('## Time / economy\n')
          end = s.index('\nNew games begin with three Cooked Food', start)
          section = '''## Time / economy\n\nSettlement time uses a direct authored clock: **5 real active seconds = 1 in-game hour**. With the existing 120-second simulation day, one full in-game day is therefore **120 real active seconds / 2 minutes**. Camp needs, work/recovery, expeditions, fire/maintenance, camp events, and daily transitions all share this same simulation clock. The Camp Perimeter expedition is authored at 10 base seconds, so it represents a 2-hour round trip before the existing Agility travel-time reduction. UI refresh and autosave cadence remain real-time responsiveness concerns rather than simulation balance.\n'''
          p.write_text(s[:start] + section + s[end:])

          p = Path('CHANGELOG.md')
          s = p.read_text()
          entry = '''## Beta Candidate — Settlement Clock Retune — 2026-09-14\n\n- Retuned settlement time to a direct **5 real seconds = 1 in-game hour** mapping. A full in-game day now takes 120 real active seconds (2 minutes).\n- The existing Camp Perimeter trip remains 10 base seconds, which now reads as a 2-hour round trip before the existing Agility travel-time reduction.\n- Needs, work/recovery, expeditions, fire/maintenance, camp events, and daily transitions continue to share the same settlement simulation clock.\n\n'''
          if not s.startswith(entry):
              p.write_text(entry + s)
          PY
          git config user.name "dmcexcess-lab"
          git config user.email "dmcexcess@gmail.com"
          git add game/scripts/GameSleepVirus.gd README_CONTEXT.md CHANGELOG.md
          git diff --cached --check
          git commit -m "Retune settlement clock to five seconds per hour"
          git push origin HEAD:main
