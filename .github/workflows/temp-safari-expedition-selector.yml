name: Temporary Safari expedition selector integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Safari expedition selector fix
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'Safari SEND OUT Selector Fix' CHANGELOG.md; then
            echo 'Safari expedition selector fix already applied.'
            exit 0
          fi
          test -f .github/scripts/temp_safari_expedition_selector_patch.py
          python3 .github/scripts/temp_safari_expedition_selector_patch.py | tee /tmp/safari-expedition.log
          grep -q 'FIRST_FIRE_SAFARI_EXPEDITION_SELECTOR_PATCH_OK' /tmp/safari-expedition.log
          grep -q 'func _cycle_expedition_zone' game/scripts/Main.gd
          grep -q 'func _close_expedition_overlay' game/scripts/Main.gd
          if grep -q 'expedition_zone = OptionButton.new()' game/scripts/Main.gd; then exit 1; fi
          grep -q 'Safari expedition selector avoids popup OptionButton' game/scripts/ci/FFArchitectureSmoke.gd
          test ! -e .github/scripts/temp_safari_expedition_selector_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/scripts/Main.gd game/scripts/ci/FFArchitectureSmoke.gd README_CONTEXT.md CHANGELOG.md .github/scripts/temp_safari_expedition_selector_patch.py
          git commit -m 'Fix Safari expedition zone selector'
          git push origin HEAD:main
