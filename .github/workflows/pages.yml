name: Build and deploy First Fire

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical source
        shell: bash
        run: |
          set -euxo pipefail
          test -f game/project.godot
          test -f game/main.tscn
          test -f game/assets/tactical_atlas.svg
          test -f game/scripts/Game.gd
          test -f game/scripts/GameThreeStat.gd
          test -f game/scripts/GameSleepVirus.gd
          test -f game/scripts/Main.gd
          test -f game/scripts/MainThreeStat.gd
          test -f game/scripts/MainSleepVirus.gd
          test -f game/scripts/FFData.gd
          test -f game/scripts/FFCombat.gd
          test -f game/scripts/FFCombatThreeStat.gd
          test -f game/scripts/FFCombatVirus.gd
          test -f game/scripts/FFTacticalVisuals.gd
          test -f game/scripts/FFTacticalEnvironments.gd
          test -f game/scripts/FFTacticalLighting.gd
          test -f game/scripts/FFTacticalTiles.gd
          test -f game/scripts/FFTacticalTime.gd
          test -f game/scripts/FFTacticalSound.gd
          test -f game/scripts/FFTacticalBalance.gd
          test -f game/scripts/FFExpeditionRules.gd
          test -f game/scripts/FFTacticalScenarios.gd
          test -f game/scripts/FFFieldEventsLegacy.gd
          test -f game/scripts/FFSaveCodec.gd
          test -f game/scripts/FFCampLifeRules.gd
          test -f game/scripts/FFCampChoreMinigame.gd
          test -f game/scripts/FFCampSocial.gd
          test -f game/scripts/FFCampView.gd
          test -f game/scripts/FFCampViewSleepVirus.gd
          test -f game/scripts/FFInspectorThreeStat.gd
          test -f game/scripts/FFInspectorVirus.gd
          test -f game/scripts/FFVirusRules.gd
          test -f game/scripts/ci/FFArchitectureSmoke.gd
          test ! -e first_fire_alpha01_web_ready.zip
          test ! -d .deploy
          test ! -d .razor
          test ! -e .github/scripts/temp_camp03e_patch.py
          test ! -e .github/scripts/temp_camp03e_trigger.txt
          test ! -e .github/workflows/temp-camp03e.yml
          test ! -e .github/scripts/temp_beta_freeze_patch.py
          test ! -e .github/scripts/temp_beta_freeze_trigger.txt
          test ! -e .github/workflows/temp-beta-freeze.yml
          test ! -e .github/scripts/temp_beta_fix.py
          test ! -e .github/scripts/temp_beta_fix_trigger.txt
          test ! -e .github/workflows/temp-beta-fix.yml
          test ! -e .github/scripts/temp_beta_logic_fix.py
          test ! -e .github/scripts/temp_beta_logic_fix_trigger.txt
          test ! -e .github/workflows/temp-beta-logic-fix.yml
          test ! -e .github/scripts/temp_tactical_items_patch.py
          test ! -e .github/scripts/temp_tactical_items_trigger.txt
          test ! -e .github/workflows/temp-tactical-items.yml
          test ! -e .github/scripts/temp_field_loot_fix.py
          test ! -e .github/scripts/temp_field_loot_fix_trigger.txt
          test ! -e .github/workflows/temp-field-loot-fix.yml
          test ! -e .github/scripts/temp_tactical_depth_balance_patch.py
          test ! -e .github/workflows/temp-tactical-depth-balance.yml
          test ! -e .github/workflows/temp-live-playtest.yml
          test ! -e .github/workflows/temp-tactical-map-depth.yml
          test ! -e .github/scripts/temp_sleep_virus_patch.py
          test ! -e .github/workflows/temp-clock-retune.yml
          grep -q 'const ExpeditionRules = preload' game/scripts/Game.gd
          grep -q 'const TacticalScenarios = preload' game/scripts/Game.gd
          grep -q 'const LegacyFieldEvents = preload' game/scripts/Game.gd
          grep -q 'const TacticalVisuals = preload' game/scripts/Game.gd
          grep -q 'const TacticalBalance = preload' game/scripts/Game.gd
          grep -q 'signal camp_chatter_requested' game/scripts/Game.gd
          grep -q 'const SAVE_SCHEMA_VERSION := 8' game/scripts/Game.gd
          grep -q 'const DAY_SECONDS := 300.0' game/scripts/Game.gd
          grep -q 'const MAX_POPULATION := 18' game/scripts/Game.gd
          grep -Fq 'func start_expedition(primary_id, zone, companion_id = -1):' game/scripts/Game.gd
          grep -Fq 'ally = make_actor(companion, ally_spawn, false)' game/scripts/FFCombat.gd
          grep -Fq 'founder["equipment"] = {"Weapon": "Utility Knife", "Secondary": "", "Clothing": "", "Pack": "", "Tool": ""}' game/scripts/Game.gd
          if grep -q 'func _settle_expedition_time_cost' game/scripts/Game.gd; then exit 1; fi
          if grep -q 'func _advance_settlement_time_for_expedition_return' game/scripts/Game.gd game/scripts/GameSleepVirus.gd; then exit 1; fi
