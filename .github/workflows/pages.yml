name: Build and deploy First Fire

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical source
        shell: bash
        run: |
          set -euxo pipefail
          test -f game/project.godot
          test -f game/main.tscn
          test -f game/scripts/Game.gd
          test -f game/scripts/Main.gd
          test -f game/scripts/FFData.gd
          test -f game/scripts/FFCombat.gd
          test -f game/scripts/FFTacticalVisuals.gd
          test -f game/scripts/FFTacticalEnvironments.gd
          test -f game/scripts/FFExpeditionRules.gd
          test -f game/scripts/FFTacticalScenarios.gd
          test -f game/scripts/FFFieldEventsLegacy.gd
          test -f game/scripts/FFSaveCodec.gd
          test -f game/scripts/FFCampLifeRules.gd
          test -f game/scripts/FFCampSocial.gd
          test -f game/scripts/ci/FFArchitectureSmoke.gd
          test ! -e first_fire_alpha01_web_ready.zip
          test ! -d .deploy
          test ! -d .razor
          grep -q 'const ExpeditionRules = preload' game/scripts/Game.gd
          grep -q 'const TacticalScenarios = preload' game/scripts/Game.gd
          grep -q 'const LegacyFieldEvents = preload' game/scripts/Game.gd
          grep -q 'const TacticalVisuals = preload' game/scripts/Game.gd
          grep -q 'const TacticalEnvironments = preload' game/scripts/FFCombat.gd
          grep -q 'const Environments = preload' game/scripts/FFTacticalScenarios.gd
          grep -q 'const SAVE_SCHEMA_VERSION := 4' game/scripts/Game.gd
          grep -q 'var current_combat := {}' game/scripts/Game.gd
          grep -q 'func resolve_combat' game/scripts/Game.gd
          grep -q 'sim_paused = true' game/scripts/Game.gd
          grep -q 'signal encounter_finished' game/scripts/FFCombat.gd
          grep -q 'TacticalVisuals.draw_survivor' game/scripts/FFCombat.gd
          grep -q 'pointing/emulate_mouse_from_touch=false' game/project.godot
          grep -q 'vram_texture_compression/for_mobile=false' game/export_presets.cfg
          if grep -q 'func _normalize_loaded_state' game/scripts/Game.gd; then exit 1; fi

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          curl -L -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q templates.tpz -d templates
          cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"

      - name: Import and parse Godot project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE/game" \
            --quit \
            2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Architecture smoke test
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path "$GITHUB_WORKSPACE/game" \
            --script res://scripts/ci/FFArchitectureSmoke.gd \
            2>&1 | tee "$RUNNER_TEMP/architecture-smoke.log"
          grep -q 'FIRST_FIRE_ARCHITECTURE_SMOKE_OK' "$RUNNER_TEMP/architecture-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/architecture-smoke.log"; then exit 1; fi

      - name: Startup smoke test
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path "$GITHUB_WORKSPACE/game" \
            --quit-after 3 \
            2>&1 | tee "$RUNNER_TEMP/startup-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/startup-smoke.log"; then exit 1; fi

      - name: Export Web build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/web"
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path "$GITHUB_WORKSPACE/game" \
            --export-release Web "$GITHUB_WORKSPACE/build/web/index.html" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/export.log"; then exit 1; fi
          touch "$GITHUB_WORKSPACE/build/web/.nojekyll"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
