      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          curl -L -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q templates.tpz -d templates
          cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"

      - name: Check core GDScript chain
        shell: bash
        run: |
          set -euxo pipefail
          for script in Game.gd GameThreeStat.gd GameSleepVirus.gd; do
            ./Godot_v4.7.1-stable_linux.x86_64 \
              --headless \
              --path "$GITHUB_WORKSPACE/game" \
              --check-only \
              --script "res://scripts/$script" \
              2>&1 | tee "$RUNNER_TEMP/check-$script.log"
          done

      - name: Import and parse Godot project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE/game" \
            --quit \
            2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Architecture smoke test
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path "$GITHUB_WORKSPACE/game" \
            --script res://scripts/ci/FFArchitectureSmoke.gd \
            2>&1 | tee "$RUNNER_TEMP/architecture-smoke.log"
          grep -q 'FIRST_FIRE_ARCHITECTURE_SMOKE_OK' "$RUNNER_TEMP/architecture-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/architecture-smoke.log"; then exit 1; fi

      - name: Startup smoke test
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path "$GITHUB_WORKSPACE/game" \
            --quit-after 3 \
            2>&1 | tee "$RUNNER_TEMP/startup-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/startup-smoke.log"; then exit 1; fi

      - name: Export Web build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/web"
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path "$GITHUB_WORKSPACE/game" \
            --export-release Web "$GITHUB_WORKSPACE/build/web/index.html" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/export.log"; then exit 1; fi
          touch "$GITHUB_WORKSPACE/build/web/.nojekyll"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4