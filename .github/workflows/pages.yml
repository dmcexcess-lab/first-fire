name: Build and deploy First Fire

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack and patch First Fire
        shell: bash
        run: |
          set -euxo pipefail
          test -f first_fire_alpha01_web_ready.zip
          mkdir -p src
          unzip -q -o first_fire_alpha01_web_ready.zip -d src
          test -f src/first_fire_alpha01_web_ready/project.godot

          cat .deploy/alpha01_patch_00.part \
              .deploy/alpha01_patch_01.part \
              .deploy/alpha01_patch_02.part \
              .deploy/alpha01_patch_03.part \
              .deploy/alpha01_patch_04.part > /tmp/first_fire_alpha01.patch
          cat .deploy/combat/combat_integration_00.b64 \
              .deploy/combat/combat_integration_01.b64 \
              .deploy/combat/combat_integration_02.b64 \
              .deploy/combat/combat_integration_03.b64 > /tmp/combat_integration.b64
          test "$(wc -c < /tmp/combat_integration.b64)" -eq 7528
          base64 -d < /tmp/combat_integration.b64 | gzip -dc > /tmp/combat_integration.patch
          base64 -d < .deploy/combat/FFCombat.gd.gz.b64 | gzip -dc > /tmp/FFCombat.gd
          (
            cd src/first_fire_alpha01_web_ready
            patch -p0 --batch < /tmp/first_fire_alpha01.patch
            patch -p0 --batch < "$GITHUB_WORKSPACE/.deploy/balance_pass.patch"
            patch -p0 --batch < "$GITHUB_WORKSPACE/.deploy/save_schema_reset.patch"
            patch -p0 --batch < /tmp/combat_integration.patch
            cp /tmp/FFCombat.gd scripts/FFCombat.gd
          )
          grep -q 'injured_stranger_return_after' src/first_fire_alpha01_web_ready/scripts/Game.gd
          grep -q 'const DAY_SECONDS := 120.0' src/first_fire_alpha01_web_ready/scripts/Game.gd
          grep -q 'func _loot_item_target' src/first_fire_alpha01_web_ready/scripts/Game.gd
          grep -q 'const SAVE_SCHEMA_VERSION := 3' src/first_fire_alpha01_web_ready/scripts/Game.gd
          grep -q 'var current_combat := {}' src/first_fire_alpha01_web_ready/scripts/Game.gd
          grep -q 'func resolve_combat' src/first_fire_alpha01_web_ready/scripts/Game.gd
          grep -q 'FFCombat.gd' src/first_fire_alpha01_web_ready/scripts/Main.gd
          grep -q 'signal encounter_finished' src/first_fire_alpha01_web_ready/scripts/FFCombat.gd
          grep -q 'pointing/emulate_mouse_from_touch=false' src/first_fire_alpha01_web_ready/project.godot
          grep -q '"save_schema": SAVE_SCHEMA_VERSION' src/first_fire_alpha01_web_ready/scripts/Game.gd
          if grep -q 'func _normalize_loaded_state' src/first_fire_alpha01_web_ready/scripts/Game.gd; then exit 1; fi
          grep -q 'Idle — recovering fatigue and stress automatically.' src/first_fire_alpha01_web_ready/scripts/Main.gd
          grep -q '"Dirty Water": 30, "Raw Food": 24' src/first_fire_alpha01_web_ready/scripts/FFData.gd

          sed -i 's#vram_texture_compression/for_mobile=true#vram_texture_compression/for_mobile=false#' src/first_fire_alpha01_web_ready/export_presets.cfg

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          curl -L -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q templates.tpz -d templates
          cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"

      - name: Export Web build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/web"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/src/first_fire_alpha01_web_ready" --export-release Web "$GITHUB_WORKSPACE/build/web/index.html"
          touch "$GITHUB_WORKSPACE/build/web/.nojekyll"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
