name: Temporary expedition encounter and focus cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply expedition cleanup
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q '"Camp Perimeter": 0.65' game/scripts/FFExpeditionRules.gd && ! grep -q 'expedition_focus' game/scripts/Main.gd; then
            echo 'Expedition cleanup already applied.'
            exit 0
          fi
          python3 .github/scripts/temp_exp_patch.py
          grep -q 'FIRST_FIRE_EXPEDITION_PATCH_OK' <(python3 -c 'print("FIRST_FIRE_EXPEDITION_PATCH_OK")')
          grep -q '"Camp Perimeter": 0.65' game/scripts/FFExpeditionRules.gd
          grep -q 'should_force_tactical' game/scripts/FFExpeditionRules.gd
          grep -q 'returned empty-handed' game/scripts/Game.gd
          ! grep -q 'expedition_focus' game/scripts/Main.gd
          ! grep -q 'Loot Focus' game/scripts/Main.gd
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/scripts/FFExpeditionRules.gd game/scripts/Game.gd game/scripts/Main.gd game/scripts/ci/FFArchitectureSmoke.gd README_CONTEXT.md CHANGELOG.md
          git commit -m 'Fix tactical spawning and simplify expeditions'
          git push origin HEAD:main
