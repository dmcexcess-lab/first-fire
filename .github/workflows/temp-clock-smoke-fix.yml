name: Temporary clock smoke contract fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-clock-smoke-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update clock architecture smoke contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('game/scripts/ci/FFArchitectureSmoke.gd')
          s = p.read_text()
          old = '''    if not _check(active_game_source.contains("const SIM_TIME_SCALE := 0.5") and active_game_source.contains("\\"status\\"] = \\"Sleeping\\"") and active_game_source.contains("func survivor_can_assign") and active_game_source.contains("func start_virus_treatment") and active_game_source.contains("func quarantine_survivor"), "authoritative sleep virus and half-speed orchestration"): return\n'''
          new = '''    if not _check(active_game_source.contains("const SIM_TIME_SCALE := 1.0") and base_game_source.contains("const DAY_SECONDS := 120.0") and active_game_source.contains("\\"status\\"] = \\"Sleeping\\"") and active_game_source.contains("func survivor_can_assign") and active_game_source.contains("func start_virus_treatment") and active_game_source.contains("func quarantine_survivor"), "authoritative sleep virus and five-seconds-per-hour orchestration"): return\n'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "dmcexcess-lab"
          git config user.email "dmcexcess@gmail.com"
          git add game/scripts/ci/FFArchitectureSmoke.gd
          git diff --cached --check
          git commit -m "Update settlement clock architecture smoke"
          git push origin HEAD:main
