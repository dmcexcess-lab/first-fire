name: Temporary live Chromium playtest

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-live-playtest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playtest:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Drive live First Fire canvas at night
        shell: bash
        run: |
          cat > playtest.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('qa', { recursive: true });
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({ viewport: { width:390, height:844 }, deviceScaleFactor:1 });
          const consoleLines=[];
          page.on('console', m => consoleLines.push(`console:${m.type()}:${m.text()}`));
          page.on('pageerror', e => consoleLines.push(`pageerror:${e.message}`));
          await page.goto('https://dmcexcess-lab.github.io/first-fire/', {waitUntil:'load', timeout:120000});
          await page.waitForTimeout(9000);
          const canvas=page.locator('canvas').first();
          if (!(await canvas.boundingBox())) throw new Error('Godot canvas not found');
          async function shot(name){ await page.screenshot({path:`qa/${name}.png`,fullPage:true}); }
          async function clickGame(gx,gy,wait=500){ const b=await canvas.boundingBox(); await page.mouse.click(b.x+(gx/390)*b.width,b.y+(gy/844)*b.height); await page.waitForTimeout(wait); }
          async function mouseGame(gx,gy){ const b=await canvas.boundingBox(); await page.mouse.move(b.x+(gx/390)*b.width,b.y+(gy/844)*b.height); }
          async function dispatch(waitMs=15000){
            await clickGame(343,810,600);
            await mouseGame(195,650); await page.mouse.wheel(0,540); await page.waitForTimeout(700);
            await clickGame(280,749,600); await clickGame(195,465,600); await page.waitForTimeout(waitMs);
          }
          await clickGame(195,354,900); // NEW GAME
          await clickGame(93,524,600); // SKIP
          await dispatch(); // first perimeter run, normally routine
          await shot('01_after_first_return');
          // One full game day is 120 real active seconds; ~55s advances about 11h.
          await page.waitForTimeout(55000);
          await shot('02_camp_late_day');
          await dispatch(); // second run: drought/random tactical, now at night
          await shot('03_tactical_night_light_on');
          await clickGame(197,721,700); // LIGHT OFF
          await shot('04_tactical_night_light_off');
          await clickGame(76,809,600); // STEALTH on while light remains off
          // Rotate enough times to advance tactical time and invite ambient/off-screen noises.
          for(let i=0;i<40;i++) await clickGame(314,739,90);
          await page.waitForTimeout(600);
          await shot('05_night_sound_check_light_off');
          await clickGame(197,721,700); // LIGHT ON again
          await shot('06_night_light_restored');
          fs.writeFileSync('qa/console.txt',consoleLines.join('\n'));
          await browser.close();
          EOF
          node playtest.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-playtest
          path: qa
          retention-days: 1
