name: Temporary live Chromium playtest

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-live-playtest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playtest:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Drive live First Fire canvas
        shell: bash
        run: |
          cat > playtest.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('qa', { recursive: true });
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({ viewport: { width:390, height:844 }, deviceScaleFactor:1 });
          const consoleLines=[];
          page.on('console', m => consoleLines.push(`console:${m.type()}:${m.text()}`));
          page.on('pageerror', e => consoleLines.push(`pageerror:${e.message}`));
          await page.goto('https://dmcexcess-lab.github.io/first-fire/', {waitUntil:'load', timeout:120000});
          await page.waitForTimeout(9000);
          const canvas = page.locator('canvas').first();
          if (!(await canvas.boundingBox())) throw new Error('Godot canvas not found');
          async function shot(name){ await page.screenshot({path:`qa/${name}.png`, fullPage:true}); }
          async function clickGame(gx,gy,wait=1200){
            const b=await canvas.boundingBox();
            await page.mouse.click(b.x+(gx/390)*b.width,b.y+(gy/844)*b.height);
            await page.waitForTimeout(wait);
          }
          async function mouseGame(gx,gy){
            const b=await canvas.boundingBox();
            await page.mouse.move(b.x+(gx/390)*b.width,b.y+(gy/844)*b.height);
          }
          async function openRoster(){
            await clickGame(343,810,900);
            await mouseGame(195,650);
            await page.mouse.wheel(0,540);
            await page.waitForTimeout(1000);
          }
          async function dispatch(n){
            await openRoster();
            await shot(`run${n}_01_roster`);
            await clickGame(280,749,900); // SEND OUT
            await shot(`run${n}_02_overlay`);
            await clickGame(195,465,900); // SEND Camp Perimeter
            await shot(`run${n}_03_sent`);
            await page.waitForTimeout(15000);
            await shot(`run${n}_04_after_wait`);
          }
          await clickGame(195,354,1200); // NEW GAME
          await clickGame(93,524,900); // SKIP tutorial
          await dispatch(1);
          await dispatch(2);
          await dispatch(3);
          await shot('final_state');
          fs.writeFileSync('qa/console.txt', consoleLines.join('\n'));
          await browser.close();
          EOF
          node playtest.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-playtest
          path: qa
          retention-days: 1
