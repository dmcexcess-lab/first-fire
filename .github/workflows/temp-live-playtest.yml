name: Temporary tactical control patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-live-playtest.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tactical controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          combat = Path('game/scripts/FFCombatThreeStat.gd')
          text = combat.read_text()
          text = text.replace('var btn_sprint := Rect2(148, 788, 98, 42)\n', 'var btn_sprint := Rect2(148, 788, 98, 42)\nvar btn_forward_primary := Rect2(148, 654, 98, 42)\n', 1)
          text = text.replace(
              'func restore_runtime():\n    super.restore_runtime()\n    if not player.is_empty(): player["sprinting"] = bool(runtime.get("sprinting", false))\n\nfunc persist_runtime():\n    super.persist_runtime()\n    if not player.is_empty():\n        runtime["sprinting"] = bool(player.get("sprinting", false))\n        Game.update_combat_runtime(runtime)\n',
              'func restore_runtime():\n    super.restore_runtime()\n    if not player.is_empty():\n        player["guarding"] = false\n        player["sprinting"] = bool(runtime.get("sprinting", false))\n    runtime.erase("guarding")\n\nfunc persist_runtime():\n    if not player.is_empty(): player["guarding"] = false\n    super.persist_runtime()\n    runtime.erase("guarding")\n    if not player.is_empty():\n        runtime["sprinting"] = bool(player.get("sprinting", false))\n        Game.update_combat_runtime(runtime)\n',
              1,
          )
          text = text.replace('            KEY_G: guard()\n', '', 1)
          text = text.replace('    if btn_forward.has_point(pos): step_forward(); return\n', '    if btn_forward_primary.has_point(pos): step_forward(); return\n', 1)
          text = text.replace('    if btn_guard.has_point(pos): guard(); return\n', '', 1)
          text = text.replace('    player["guarding"] = false\n    player["sprinting"] = false\n    player.crouched', '    player["sprinting"] = false\n    player.crouched', 1)
          text = text.replace('    player["guarding"] = false\n    player.crouched = false\n', '    player.crouched = false\n', 1)
          text = text.replace('    player["guarding"] = false\n    player.pos = dest\n', '    player.pos = dest\n', 1)
          text = text.replace('    player["guarding"] = false; player["sprinting"] = false; player.facing = dominant(target - player.pos)\n', '    player["sprinting"] = false; player.facing = dominant(target - player.pos)\n', 1)
          text = text.replace('    player["guarding"] = false; player["sprinting"] = false; player.facing = dominant(z.pos - player.pos)\n', '    player["sprinting"] = false; player.facing = dominant(z.pos - player.pos)\n', 1)
          old_block = '''func guard():\n    player["sprinting"] = false\n    super.guard()\n\nfunc shove():\n    player["sprinting"] = false\n    # Base shove explicitly clears guarding before resolution. Shoving always\n    # sacrifices the defensive state even when the shove misses.\n    super.shove()\n\nfunc zombie_attack(i: int, target_actor: Dictionary):\n    var guarded := bool(target_actor.get("guarding", false))\n    var hit: float = BalanceThree.zombie_hit_chance(target_actor)\n    if target_actor.controlled and guarded: target_actor["guarding"] = false\n    if rng.randf() <= hit:\n        var damage_range: Vector2i = BalanceThree.zombie_damage_range(str(zombies[i].get("mass", "MED")))\n        var dmg := rng.randi_range(damage_range.x, damage_range.y)\n        if guarded: dmg = maxi(1, dmg - 1)\n        # No armor layer: clothing never reduces or cancels physical damage.\n        target_actor.hp -= dmg\n        _flash_hit(target_actor.pos, int(target_actor.hp) <= 0)\n        if target_actor.controlled:\n            stats.damage += dmg\n            msg = "The infected breaks through your guard for %d." % dmg if guarded else "The infected hits you for %d." % dmg\n        else: msg = "%s gets hit." % target_actor.name\n        if target_actor.hp <= 0: target_actor.hp = 0; target_actor.dead = true\n    elif target_actor.controlled:\n        msg = "You deflect the grab." if guarded else ("You outrun the grab." if bool(target_actor.get("sprinting", false)) else "You avoid the grab.")\n    zombies[i].next = tick + TimeThree.zombie_attack_cost(zombies[i])\n'''
          new_block = '''func shove():\n    player["sprinting"] = false\n    super.shove()\n\nfunc zombie_attack(i: int, target_actor: Dictionary):\n    var hit: float = BalanceThree.zombie_hit_chance(target_actor)\n    if rng.randf() <= hit:\n        var damage_range: Vector2i = BalanceThree.zombie_damage_range(str(zombies[i].get("mass", "MED")))\n        var dmg := rng.randi_range(damage_range.x, damage_range.y)\n        # No armor layer: clothing never reduces or cancels physical damage.\n        target_actor.hp -= dmg\n        _flash_hit(target_actor.pos, int(target_actor.hp) <= 0)\n        if target_actor.controlled:\n            stats.damage += dmg\n            msg = "The infected hits you for %d." % dmg\n        else: msg = "%s gets hit." % target_actor.name\n        if target_actor.hp <= 0: target_actor.hp = 0; target_actor.dead = true\n    elif target_actor.controlled:\n        msg = "You outrun the grab." if bool(target_actor.get("sprinting", false)) else "You avoid the grab."\n    zombies[i].next = tick + TimeThree.zombie_attack_cost(zombies[i])\n'''
          if old_block not in text: raise SystemExit('active guard block mismatch')
          text = text.replace(old_block, new_block, 1)
          text = text.replace(
              '    draw_button(btn_turn_left,"TURN L",false,17); draw_button(btn_crouch,"STEALTH",bool(player.crouched),10); draw_button(btn_forward,"FORWARD",false,11)\n    draw_button(btn_turn_right,"TURN R",false,17); draw_button(btn_back,"BACK",false,11); draw_button(btn_guard,"GUARD",bool(player.get("guarding", false)),10)\n',
              '    draw_button(btn_turn_left,"TURN L",false,17); draw_button(btn_crouch,"STEALTH",bool(player.crouched),10); draw_button(btn_forward_primary,"FORWARD",false,11)\n    draw_button(btn_turn_right,"TURN R",false,17); draw_button(btn_back,"BACK",false,11)\n',
              1,
          )
          text = text.replace('    draw_string(font,Vector2(258,821),"T %d  STEP %d  K %d"%[tick,step_cost,int(stats.kills)],HORIZONTAL_ALIGNMENT_CENTER,124,8,Color(.62,.68,.64))\n', '    draw_string(font,Vector2(258,678),"T %d  STEP %d  K %d"%[tick,step_cost,int(stats.kills)],HORIZONTAL_ALIGNMENT_CENTER,124,8,Color(.62,.68,.64))\n', 1)
          for marker in ['var btn_forward_primary := Rect2(148, 654, 98, 42)', 'if btn_forward_primary.has_point(pos): step_forward()', 'draw_button(btn_forward_primary,"FORWARD"']:
              if marker not in text: raise SystemExit(f'missing combat marker: {marker}')
          if 'KEY_G: guard()' in text or 'func guard():' in text or 'draw_button(btn_guard,"GUARD"' in text:
              raise SystemExit('active Guard surface still present')
          combat.write_text(text)

          balance = Path('game/scripts/FFTacticalBalance.gd')
          text = balance.read_text()
          guard_bonus = '''static func guard_bonus(actor: Dictionary) -> float:\n    var combat := int(actor.get("skills", {}).get("Combat", 0))\n    var agility := int(actor.get("skills", {}).get("Agility", 0))\n    return clampf(0.17 + float(combat) * 0.008 + float(agility) * 0.006, 0.17, 0.30)\n\n'''
          if guard_bonus not in text: raise SystemExit('guard bonus block missing')
          text = text.replace(guard_bonus, '', 1)
          text = text.replace('    if bool(actor.get("guarding", false)):\n        chance -= guard_bonus(actor)\n', '', 1)
          balance.write_text(text)

          smoke = Path('game/scripts/ci/FFArchitectureSmoke.gd')
          text = smoke.read_text()
          old = '    var actor := {"skills": {"Combat": 3, "Agility": 4, "Leadership": 1}, "fatigue": 0.0, "guarding": false, "sprinting": false, "crouched": false}\n    var guarded := actor.duplicate(true); guarded["guarding"] = true\n    var sprinting := actor.duplicate(true); sprinting["sprinting"] = true\n    if not _check(TacticalBalance.zombie_hit_chance(guarded) < TacticalBalance.zombie_hit_chance(actor), "guard reduces grab chance"): return\n'
          new = '    var actor := {"skills": {"Combat": 3, "Agility": 4, "Leadership": 1}, "fatigue": 0.0, "sprinting": false, "crouched": false}\n    var sprinting := actor.duplicate(true); sprinting["sprinting"] = true\n'
          if old not in text: raise SystemExit('smoke guard block mismatch')
          text = text.replace(old, new, 1)
          old = '    if not _check(combat_source.contains("super.shove()") and combat_source.contains("sacrifices the defensive state"), "shove drops guard"): return\n'
          new = '    if not _check(not combat_source.contains("func guard():") and not combat_source.contains("KEY_G: guard()"), "guard removed from active combat"): return\n    if not _check(combat_source.contains("btn_forward_primary") and combat_source.contains("draw_button(btn_forward_primary,\\"FORWARD\\""), "forward occupies former guard slot"): return\n    if not _check(combat_source.contains("func shove()") and combat_source.contains("super.shove()"), "shove remains active"): return\n'
          if old not in text: raise SystemExit('smoke shove contract mismatch')
          smoke.write_text(text.replace(old, new, 1))

          context = Path('README_CONTEXT.md')
          text = context.read_text()
          old = '- **Guard** — spend time on defense to reduce the next infected grab threat.\n- **Shove** — spacing/stagger action; heavier infected resist it more, and attempting a shove always drops Guard before resolution.\n'
          new = '- **Forward** — dedicated touch movement action, now placed in the former Guard control slot for faster thumb access.\n- **Shove** — spacing/stagger action; heavier infected resist it more.\n'
          if old not in text: raise SystemExit('context guard bullets mismatch')
          context.write_text(text.replace(old, new, 1))

          architecture = Path('ARCHITECTURE.md')
          text = architecture.read_text()
          old = '- **Guard** — defensive stance reducing the next infected grab threat\n- **Shove** — spacing/stagger action that always sacrifices Guard before resolution\n'
          new = '- **Forward** — dedicated touch movement action occupying the former Guard slot\n- **Shove** — spacing/stagger action with mass-based resistance/stagger\n'
          if old not in text: raise SystemExit('architecture guard bullets mismatch')
          text = text.replace(old, new, 1)
          text = text.replace('It owns infected counts/damage, search timing/noise, Guard, Shove resistance/stagger, and zombie hit chance.', 'It owns infected counts/damage, search timing/noise, Shove resistance/stagger, and zombie hit chance.', 1)
          architecture.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          entry = '''## Beta Candidate — Forward Control & Guard Removal — 2026-09-11\n\n- Removed Guard from the active tactical combat model and from infected hit/damage handling.\n- Moved the dedicated FORWARD touch action into Guard's former center-top control slot; the previous forward slot now carries the compact tactical tick/step/kill readout instead of overlapping BACK.\n- Shove remains the spacing/stagger action, with infected mass continuing to affect resistance and stagger.\n- Existing in-progress tactical runtime discards stale Guard state without changing save schema 7.\n\n'''
          if not text.startswith('## Beta Candidate — Forward Control & Guard Removal'):
              changelog.write_text(entry + text)
          PY

          git diff --check
          git status --short
          git config user.name "dmcexcess-lab"
          git config user.email "dmcexcess@gmail.com"
          git add game/scripts/FFCombatThreeStat.gd game/scripts/FFTacticalBalance.gd game/scripts/ci/FFArchitectureSmoke.gd README_CONTEXT.md ARCHITECTURE.md CHANGELOG.md
          git commit -m "Remove tactical guard and center forward control"
          git push origin HEAD:main
