name: Temporary live Chromium playtest

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-live-playtest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playtest:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 pngjs@7.0.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Drive live First Fire canvas at night
        shell: bash
        run: |
          cat > playtest.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { PNG } from 'pngjs';
          import fs from 'fs';
          fs.mkdirSync('qa', { recursive: true });
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({ viewport: { width:390, height:844 }, deviceScaleFactor:1 });
          const consoleLines=[];
          page.on('console', m => consoleLines.push(`console:${m.type()}:${m.text()}`));
          page.on('pageerror', e => consoleLines.push(`pageerror:${e.message}`));
          await page.goto('https://dmcexcess-lab.github.io/first-fire/', {waitUntil:'load', timeout:120000});
          await page.waitForTimeout(9000);
          const canvas=page.locator('canvas').first();
          if (!(await canvas.boundingBox())) throw new Error('Godot canvas not found');
          async function shot(name){ await page.screenshot({path:`qa/${name}.png`,fullPage:true}); }
          async function clickGame(gx,gy,wait=500){ const b=await canvas.boundingBox(); await page.mouse.click(b.x+(gx/390)*b.width,b.y+(gy/844)*b.height); await page.waitForTimeout(wait); }
          async function mouseGame(gx,gy){ const b=await canvas.boundingBox(); await page.mouse.move(b.x+(gx/390)*b.width,b.y+(gy/844)*b.height); }
          async function tacticalState(){
            const png=PNG.sync.read(await canvas.screenshot());
            const x=10, y=649, idx=(y*png.width+x)*4;
            const rgb=[png.data[idx],png.data[idx+1],png.data[idx+2]];
            console.log('TACTICAL_SAMPLE',rgb.join(','));
            return rgb[0]>45 && rgb[1]>45 && rgb[2]>45;
          }
          async function dispatch(){
            await clickGame(343,810,600);
            await mouseGame(195,650); await page.mouse.wheel(0,540); await page.waitForTimeout(700);
            await clickGame(280,749,600); await clickGame(195,465,600); await page.waitForTimeout(15000);
          }
          await clickGame(195,354,900); // NEW GAME
          await clickGame(93,524,600); // SKIP
          await shot('01_camp_morning');
          // 60 real active seconds = 12 in-game hours, moving the 08:00 start to evening.
          await page.waitForTimeout(60000);
          await shot('02_camp_evening');
          await dispatch();
          await shot('03_after_dispatch_1');
          let tactical=await tacticalState();
          console.log('TACTICAL_AFTER_1',tactical);
          if(!tactical){
            await dispatch();
            await shot('04_after_dispatch_2');
            tactical=await tacticalState();
            console.log('TACTICAL_AFTER_2',tactical);
          }
          if(!tactical) throw new Error('No tactical encounter reached after two evening perimeter runs');
          await shot('05_night_tactical_light_on');
          await clickGame(197,721,650); // LIGHT OFF
          await shot('06_night_tactical_light_off');
          await clickGame(76,809,500); // STEALTH
          for(let i=0;i<28;i++) await clickGame(314,739,85); // advance time, listen for fuzzy sounds
          await page.waitForTimeout(500);
          await shot('07_night_sound_check');
          await clickGame(197,721,650); // LIGHT ON
          await shot('08_night_tactical_light_restored');
          fs.writeFileSync('qa/console.txt',consoleLines.join('\n'));
          await browser.close();
          EOF
          node playtest.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-playtest
          path: qa
          retention-days: 1
