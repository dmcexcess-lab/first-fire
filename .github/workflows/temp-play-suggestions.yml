name: Temporary playtest for gameplay suggestions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-play-suggestions.yml

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Sample multiple live expeditions
        run: |
          cat > play.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('play', {recursive:true});
          const browser = await chromium.launch({headless:true});
          async function attempt(n) {
            const context = await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1});
            const page = await context.newPage();
            const logs=[];
            page.on('console', m=>logs.push(`console:${m.type()}:${m.text()}`));
            page.on('pageerror', e=>logs.push(`pageerror:${e.message}`));
            await page.goto('https://dmcexcess-lab.github.io/first-fire/', {waitUntil:'load', timeout:120000});
            await page.waitForTimeout(9000);
            const canvas = page.locator('canvas').first();
            async function clickGame(x,y,wait=700){const b=await canvas.boundingBox();await page.mouse.click(b.x+(x/390)*b.width,b.y+(y/844)*b.height);await page.waitForTimeout(wait);}
            await clickGame(195,354,900);
            await clickGame(93,524,1000);
            await clickGame(125,805,800);
            await clickGame(195,670,900);
            await page.waitForTimeout(26000);
            await page.screenshot({path:`play/${n}_after_26s.png`,fullPage:true});
            for (const key of ['KeyL','KeyC','KeyW','KeyW','KeyE','KeyW','KeyX','KeyQ','KeyW']) {
              await page.keyboard.press(key);
              await page.waitForTimeout(120);
            }
            await page.waitForTimeout(1000);
            await page.screenshot({path:`play/${n}_after_keys.png`,fullPage:true});
            fs.writeFileSync(`play/${n}_console.txt`,logs.join('\n'));
            await context.close();
          }
          await Promise.all([attempt(1),attempt(2),attempt(3),attempt(4),attempt(5)]);
          await browser.close();
          EOF
          node play.mjs
      - name: Upload play evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-fire-multi-expedition-playtest
          path: play
          retention-days: 1
