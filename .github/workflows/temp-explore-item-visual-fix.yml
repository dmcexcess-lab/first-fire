name: Temporary explore item visual fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore physical explore gear visuals
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'Each search takes time and makes noise' game/scripts/FFCombat.gd; then
            echo 'Explore item visual fix already applied.'
            exit 0
          fi
          python3 .github/scripts/temp_explore_item_visual_fix.py | tee /tmp/explore-item-visual.log
          grep -q 'FIRST_FIRE_EXPLORE_ITEM_VISUAL_FIX_OK' /tmp/explore-item-visual.log
          grep -q 'TacticalVisuals.field_gear_visual' game/scripts/FFCombat.gd
          test ! -e .github/scripts/temp_explore_item_visual_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/scripts/FFCombat.gd .github/scripts/temp_explore_item_visual_fix.py
          git commit -m 'Restore physical explore item visuals'
          git push origin HEAD:main
