name: Temporary survivor UI integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: survivor-ui-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate survivor dashboard and inspector
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("game/scripts/Main.gd")
          text = path.read_text()

          if 'const SurvivorPanel = preload("res://scripts/FFSurvivorPanel.gd")' in text:
              print("Survivor UI already integrated.")
              raise SystemExit(0)

          text = text.replace(
              'const FFCombat = preload("res://scripts/FFCombat.gd")\n',
              'const FFCombat = preload("res://scripts/FFCombat.gd")\n'
              'const SurvivorPanel = preload("res://scripts/FFSurvivorPanel.gd")\n'
              'const InspectorOverlay = preload("res://scripts/FFInspector.gd")\n',
              1,
          )
          text = text.replace(
              'var combat_overlay: Control\nvar combat_uid := ""\n',
              'var combat_overlay: Control\nvar combat_uid := ""\nvar inspector_overlay: Control\n',
              1,
          )
          text = text.replace(
              '    _build_main_menu()\n    _build_combat_overlay()\n',
              '    _build_main_menu()\n    _build_inspector_overlay()\n    _build_combat_overlay()\n',
              1,
          )

          marker = 'func _build_combat_overlay():\n'
          inspector_builder = '''func _build_inspector_overlay():
    inspector_overlay = InspectorOverlay.new()
    inspector_overlay.send_survivor.connect(_on_inspector_send)
    add_child(inspector_overlay)

'''
          if marker not in text:
              raise SystemExit("combat overlay marker missing")
          text = text.replace(marker, inspector_builder + marker, 1)

          combat_anchor = '''    if event_overlay != null:
        event_overlay.visible = false
'''
          combat_replacement = combat_anchor + '''    if inspector_overlay != null and inspector_overlay.visible:
        inspector_overlay.force_close()
'''
          if combat_anchor not in text:
              raise SystemExit("combat refresh anchor missing")
          text = text.replace(combat_anchor, combat_replacement, 1)

          menu_anchor = '''func _show_main_menu():
    if not Game.current_combat.is_empty():
        _refresh_combat_overlay()
        return
    Game.set_paused(true)
'''
          menu_replacement = '''func _show_main_menu():
    if not Game.current_combat.is_empty():
        _refresh_combat_overlay()
        return
    if inspector_overlay != null and inspector_overlay.visible:
        inspector_overlay.force_close()
    Game.set_paused(true)
'''
          if menu_anchor not in text:
              raise SystemExit("main menu anchor missing")
          text = text.replace(menu_anchor, menu_replacement, 1)

          survivor_start = text.index('func _draw_survivors():\n')
          worker_start = text.index('func _worker_picker():\n', survivor_start)
          new_survivor = '''func _draw_survivors():
    var panel = SurvivorPanel.new()
    panel.inspect_survivor.connect(_open_survivor_inspector)
    panel.inspect_inventory.connect(_open_camp_inventory_inspector)
    panel.send_survivor.connect(_send_survivor_from_panel)
    content_box.add_child(panel)

'''
          text = text[:survivor_start] + new_survivor + text[worker_start:]

          quick_start = text.index('func _on_quick_survivor_pressed(id):\n')
          craft_start = text.index('func _on_craft_pressed(station, recipe_id):\n', quick_start)
          new_handlers = '''func _open_survivor_inspector(id):
    selected_survivor_id = int(id)
    if inspector_overlay != null:
        inspector_overlay.open_survivor(selected_survivor_id)

func _open_camp_inventory_inspector():
    if inspector_overlay != null:
        inspector_overlay.open_inventory()

func _send_survivor_from_panel(id):
    selected_survivor_id = int(id)
    _open_expedition_overlay()

func _on_inspector_send(id):
    selected_survivor_id = int(id)
    _open_expedition_overlay()

'''
          text = text[:quick_start] + new_handlers + text[craft_start:]

          equip_block = '''func _on_equip_pressed(gear):
    Game.equip_gear(selected_survivor_id, gear)

'''
          text = text.replace(equip_block, '', 1)

          required = [
              'const SurvivorPanel = preload("res://scripts/FFSurvivorPanel.gd")',
              'const InspectorOverlay = preload("res://scripts/FFInspector.gd")',
              'func _build_inspector_overlay():',
              'panel.inspect_inventory.connect(_open_camp_inventory_inspector)',
              'inspector_overlay.open_survivor(selected_survivor_id)',
              "window.location.href='https://www.google.com/';",
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f"integration assertion failed: {needle}")

          path.write_text(text)
          PY

          git diff --check
          grep -q 'const SurvivorPanel = preload' game/scripts/Main.gd
          grep -q 'const InspectorOverlay = preload' game/scripts/Main.gd
          grep -q 'panel.inspect_inventory.connect' game/scripts/Main.gd
          grep -q "window.location.href='https://www.google.com/';" game/scripts/Main.gd

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/scripts/Main.gd
          if git diff --cached --quiet; then
            echo "No integration changes needed."
            exit 0
          fi
          git commit -m "Integrate survivor dashboard and paused inspectors"
          git push origin HEAD:main
