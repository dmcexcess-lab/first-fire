name: Inspect First Fire combat integration points

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p src
          unzip -q -o first_fire_alpha01_web_ready.zip -d src
          cat .deploy/alpha01_patch_00.part .deploy/alpha01_patch_01.part .deploy/alpha01_patch_02.part .deploy/alpha01_patch_03.part .deploy/alpha01_patch_04.part > /tmp/base.patch
          cd src/first_fire_alpha01_web_ready
          patch -p0 --batch < /tmp/base.patch
          patch -p0 --batch < "$GITHUB_WORKSPACE/.deploy/balance_pass.patch"
          patch -p0 --batch < "$GITHUB_WORKSPACE/.deploy/save_schema_reset.patch"
      - name: Print key integration surfaces
        shell: python
        run: |
          from pathlib import Path
          root = Path('src/first_fire_alpha01_web_ready')
          game = (root/'scripts/Game.gd').read_text()
          main = (root/'scripts/Main.gd').read_text()

          def funcs(text):
              lines=text.splitlines(); starts=[]
              for i,l in enumerate(lines):
                  if l.startswith('func '): starts.append(i)
              out={}
              for n,i in enumerate(starts):
                  j=starts[n+1] if n+1<len(starts) else len(lines)
                  name=lines[i].split('func ',1)[1].split('(',1)[0].strip()
                  out[name]='\n'.join(lines[i:j])
              return out

          gf=funcs(game); mf=funcs(main)
          for n in ['_ready','new_game','start_expedition','_process_expeditions','_resolve_routine_danger','_queue_recruit_offer','_queue_field_result','_queue_closed_result','_finish_event_expedition','skill_check','save_game','load_game']:
              if n in gf: print(f'\n=== Game.{n} ===\n{gf[n]}')
          for n in ['_ready','_build_event_overlay','_refresh_event_overlay','_on_event_choice']:
              if n in mf: print(f'\n=== Main.{n} ===\n{mf[n]}')
          print('\n=== PROJECT ===')
          print((root/'project.godot').read_text())
      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: reconstructed-first-fire-source
          path: src/first_fire_alpha01_web_ready
          retention-days: 1
