name: Temporary active camp work and pets
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-camp-pets-work.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pets and active camp loop
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'missing anchor in {path}: {old[:140]!r}')
              p.write_text(text.replace(old,new,1))

          # Camp-life rules: routine needs remain autonomous; productive chores and pet care are player-driven.
          p=Path('game/scripts/FFCampLifeRules.gd'); t=p.read_text()
          t=t.replace('const FIRE_MAINTAIN_SECONDS := 5.0\nconst NEED_KEYS', 'const FIRE_MAINTAIN_SECONDS := 5.0\nconst CAMP_MAINTENANCE_START := 82.0\nconst CAMP_MAINTENANCE_DECAY_PER_SECOND := 0.035\nconst MAX_PETS := 3\nconst PET_NEED_KEYS := ["hunger", "thirst", "affection", "cleanliness"]\nconst PET_NAMES := ["Mochi", "Scout", "Beans", "Pepper", "Lucky", "Ash", "Noodle", "Patch", "Sunny", "Rook"]\nconst NEED_KEYS',1)
          t=t.replace('static func safety_target(buildings:Dictionary,population_count:int,shelter_capacity_value:int,fire_level:float,away:bool)->float:', 'static func safety_target(buildings:Dictionary,population_count:int,shelter_capacity_value:int,fire_level:float,away:bool,camp_maintenance:float=100.0)->float:',1)
          t=t.replace('    if population_count>shelter_capacity_value: v-=float(population_count-shelter_capacity_value)*8.0\n    return clampf(v,5.0,95.0)', '    if population_count>shelter_capacity_value: v-=float(population_count-shelter_capacity_value)*8.0\n    if camp_maintenance < 30.0: v -= 12.0\n    elif camp_maintenance < 55.0: v -= 5.0\n    elif camp_maintenance >= 85.0: v += 3.0\n    return clampf(v,5.0,95.0)',1)
          old='''static func choose_available_activity(needs:Dictionary,fire_level:float,wood:int,pop:int,has_table:bool,hygiene_support:bool,rng:RandomNumberGenerator)->Dictionary:\n    var n:=normalize_needs(needs)\n    if fire_level<FIRE_MAINTAIN_THRESHOLD and wood>0: return {"kind":"maintain_fire","label":"Maintaining Fire","remaining":FIRE_MAINTAIN_SECONDS,"duration":FIRE_MAINTAIN_SECONDS}\n    if float(n["sleep"])<48.0: return {"kind":"rest","label":"Resting","remaining":7.0,"duration":7.0}\n    if float(n["hygiene"])<42.0 and hygiene_support: return {"kind":"wash","label":"Washing Up","remaining":5.0,"duration":5.0}\n    # Leisure activities must be backed by real camp items before entering this pool.\n    # Watching the fire is the only item-free fun action for now.\n    if float(n["fun"])<58.0:\n        return {"kind":"watch_fire","label":"Watching Fire","remaining":7.0,"duration":7.0}\n    return {}\n'''
          new='''static func choose_available_activity(needs:Dictionary,fire_level:float,wood:int,pop:int,has_table:bool,hygiene_support:bool,rng:RandomNumberGenerator)->Dictionary:\n    # Idle needs are autonomous. Productive camp labor is never auto-assigned.\n    var n:=normalize_needs(needs)\n    if float(n["sleep"])<48.0: return {"kind":"rest","label":"Sleeping","remaining":7.0,"duration":7.0}\n    if float(n["fun"])<58.0: return {"kind":"watch_fire","label":"Watching Fire","remaining":7.0,"duration":7.0}\n    return {}\n'''
          if old not in t: raise SystemExit('camp activity anchor missing')
          t=t.replace(old,new,1)
          insert='''\nstatic func default_pet_needs() -> Dictionary:\n    return {"hunger":78.0,"thirst":82.0,"affection":70.0,"cleanliness":72.0}\n\nstatic func normalize_pet_needs(value) -> Dictionary:\n    var result:=default_pet_needs()\n    var incoming:Dictionary=value.duplicate(true) if value is Dictionary else {}\n    for key in PET_NEED_KEYS: result[key]=clampf(float(incoming.get(key,result[key])),0.0,100.0)\n    return result\n\nstatic func update_pet_needs(needs:Dictionary,delta:float)->Dictionary:\n    var n:=normalize_pet_needs(needs)\n    n["hunger"]=clampf(float(n["hunger"])-delta*0.07,0.0,100.0)\n    n["thirst"]=clampf(float(n["thirst"])-delta*0.09,0.0,100.0)\n    n["affection"]=clampf(float(n["affection"])-delta*0.04,0.0,100.0)\n    n["cleanliness"]=clampf(float(n["cleanliness"])-delta*0.035,0.0,100.0)\n    return n\n\nstatic func apply_pet_care(needs:Dictionary,action:String)->Dictionary:\n    var n:=normalize_pet_needs(needs)\n    match action:\n        "feed": n["hunger"]=clampf(float(n["hunger"])+42.0,0.0,100.0)\n        "water": n["thirst"]=clampf(float(n["thirst"])+52.0,0.0,100.0)\n        "play": n["affection"]=clampf(float(n["affection"])+38.0,0.0,100.0)\n        "groom": n["cleanliness"]=clampf(float(n["cleanliness"])+46.0,0.0,100.0)\n    return n\n\nstatic func pet_mood(needs:Dictionary)->String:\n    var n:=normalize_pet_needs(needs)\n    var lowest:=100.0\n    for key in PET_NEED_KEYS: lowest=minf(lowest,float(n[key]))\n    if lowest < 18.0: return "DISTRESSED"\n    if lowest < 35.0: return "NEEDS CARE"\n    if lowest < 60.0: return "OKAY"\n    if float(n["affection"]) >= 82.0: return "BONDED"\n    return "CONTENT"\n\nstatic func pet_can_forage(needs:Dictionary)->bool:\n    var n:=normalize_pet_needs(needs)\n    return float(n["hunger"])>=42.0 and float(n["thirst"])>=42.0 and float(n["affection"])>=48.0\n\nstatic func pet_forage_resource(species:String,rng:RandomNumberGenerator)->String:\n    var pool:Array = ["Wood","Cloth","Plastic","Raw Food"] if species=="Dog" else ["Cloth","Plastic","Raw Food","Raw Food"]\n    return str(pool[rng.randi_range(0,pool.size()-1)])\n'''
          marker='\nstatic func fatigue_gain(base_amount: float) -> float:'
          if marker not in t: raise SystemExit('fatigue marker missing')
          t=t.replace(marker,insert+marker,1); p.write_text(t)

          # Game orchestration/state.
          path='game/scripts/Game.gd'
          replace_once(path,'var fire_level := CampLifeRules.FIRE_START_LEVEL\n','var fire_level := CampLifeRules.FIRE_START_LEVEL\nvar camp_maintenance := CampLifeRules.CAMP_MAINTENANCE_START\nvar pets := []\nvar next_pet_id := 1\n')
          replace_once(path,'    fire_level = CampLifeRules.FIRE_START_LEVEL\n    camp_event_accum = 0.0','    fire_level = CampLifeRules.FIRE_START_LEVEL\n    camp_maintenance = CampLifeRules.CAMP_MAINTENANCE_START\n    pets = []\n    next_pet_id = 1\n    camp_event_accum = 0.0')
          replace_once(path,'    fire_level = maxf(0.0, fire_level - CampLifeRules.FIRE_DECAY_PER_SECOND * float(delta))\n    _process_survivors(delta)','    fire_level = maxf(0.0, fire_level - CampLifeRules.FIRE_DECAY_PER_SECOND * float(delta))\n    camp_maintenance = maxf(0.0, camp_maintenance - CampLifeRules.CAMP_MAINTENANCE_DECAY_PER_SECOND * float(delta))\n    _process_pets(float(delta))\n    _process_survivors(delta)')
          replace_once(path,'        var safety:=CampLifeRules.safety_target(buildings,pop,capacity,fire_level,away)','        var safety:=CampLifeRules.safety_target(buildings,pop,capacity,fire_level,away,camp_maintenance)')
          replace_once(path,'        elif ["Crafting","Building","Recovering","Tending"].has(s["status"]):','        elif ["Chore","Pet Care"].has(s["status"]):\n            s["camp_activity"]={}\n            if s["task"].is_empty(): s["status"]="Available"\n        elif ["Crafting","Building","Recovering","Tending"].has(s["status"]):')
          insert_game='''func _process_pets(delta:float)->void:\n    for pet in pets:\n        pet["needs"]=CampLifeRules.update_pet_needs(pet.get("needs",{}),delta)\n\nfunc get_pet(pet_id:int) -> Variant:\n    for pet in pets:\n        if int(pet.get("id",-1))==pet_id: return pet\n    return null\n\nfunc pet_mood_label(pet:Dictionary)->String:\n    return CampLifeRules.pet_mood(pet.get("needs",{}))\n\nfunc _generate_pet_candidate()->Dictionary:\n    var species := "Dog" if rng.randf()<0.58 else "Cat"\n    var name := str(CampLifeRules.PET_NAMES[rng.randi_range(0,CampLifeRules.PET_NAMES.size()-1)])\n    return {\n        "id": -10000-next_pet_id, "name": name, "species": species, "is_pet": true,\n        "skills": {"Combat":0,"Agility":3,"Leadership":0}, "traits": [], "fatigue":0.0,"stress":35.0,\n        "condition":"Healthy", "equipment":{"Weapon":"","Secondary":"","Clothing":"","Pack":"","Tool":""},\n        "appearance":{}, "needs":CampLifeRules.default_pet_needs()\n    }\n\nfunc _add_pet(candidate_value)->Variant:\n    if pets.size()>=CampLifeRules.MAX_PETS:\n        toast_requested.emit("First Fire can only support %d pets right now." % CampLifeRules.MAX_PETS); return null\n    var candidate:Dictionary=candidate_value.duplicate(true) if candidate_value is Dictionary else {}\n    if candidate.is_empty(): candidate=_generate_pet_candidate()\n    candidate["id"]=next_pet_id; next_pet_id+=1\n    candidate["is_pet"]=true\n    candidate["needs"]=CampLifeRules.normalize_pet_needs(candidate.get("needs",{}))\n    candidate.erase("skills"); candidate.erase("traits"); candidate.erase("fatigue"); candidate.erase("stress"); candidate.erase("condition"); candidate.erase("equipment"); candidate.erase("appearance")\n    pets.append(candidate)\n    _add_history("Day %d — %s the %s was rescued and brought to First Fire." % [day,candidate["name"],candidate["species"]])\n    toast_requested.emit("%s the %s joined camp." % [candidate["name"],candidate["species"]])\n    save_game(); state_changed.emit(); return candidate\n\nfunc start_camp_chore(sid:int,chore:String)->bool:\n    var s:Variant=get_survivor(sid)\n    if s==null or s["status"]!="Available": return false\n    var label:=""; var goal:=4\n    match chore:\n        "stoke_fire":\n            if int(resources.get("Wood",0))<=0: toast_requested.emit("Stoking the fire needs 1 Wood."); return false\n            resources["Wood"]=int(resources.get("Wood",0))-1; label="Stoke First Fire"; goal=4\n        "clean_camp": label="Clean Camp"; goal=5\n        "repair_perimeter":\n            if int(resources.get("Scrap Metal",0))>0: resources["Scrap Metal"]=int(resources.get("Scrap Metal",0))-1\n            elif int(resources.get("Wood",0))>0: resources["Wood"]=int(resources.get("Wood",0))-1\n            else: toast_requested.emit("Perimeter maintenance needs 1 Scrap Metal or Wood."); return false\n            label="Repair Perimeter"; goal=6\n        _: return false\n    _clear_camp_activity(s); s["status"]="Chore"; s["task"]={"kind":"chore","chore":chore,"label":label,"progress":0,"goal":goal}\n    save_game(); state_changed.emit(); return true\n\nfunc start_pet_care(sid:int,pet_id:int,action:String)->bool:\n    var s:Variant=get_survivor(sid); var pet:Variant=get_pet(pet_id)\n    if s==null or s["status"]!="Available" or pet==null: return false\n    if action=="feed":\n        if int(resources.get("Raw Food",0))>0: resources["Raw Food"]=int(resources.get("Raw Food",0))-1\n        elif int(resources.get("Cooked Food",0))>0: resources["Cooked Food"]=int(resources.get("Cooked Food",0))-1\n        else: toast_requested.emit("Pet feeding needs 1 Raw or Cooked Food."); return false\n    elif action=="water":\n        if int(resources.get("Clean Water",0))<=0: toast_requested.emit("Pet watering needs 1 Clean Water."); return false\n        resources["Clean Water"]=int(resources.get("Clean Water",0))-1\n    elif action not in ["play","groom"]: return false\n    _clear_camp_activity(s); s["status"]="Pet Care"\n    s["task"]={"kind":"pet_care","pet_id":pet_id,"action":action,"label":"%s %s" % [action.capitalize(),pet["name"]],"progress":0,"goal":3 if action in ["feed","water"] else 4}\n    save_game(); state_changed.emit(); return true\n\nfunc perform_camp_task_tap(sid:int)->bool:\n    var s:Variant=get_survivor(sid)\n    if s==null or not ["Chore","Pet Care"].has(str(s.get("status",""))) or s.get("task",{}).is_empty(): return false\n    s["task"]["progress"]=int(s["task"].get("progress",0))+1\n    s["fatigue"]=minf(100.0,float(s.get("fatigue",0.0))+0.7)\n    if int(s["task"]["progress"])>=int(s["task"].get("goal",1)): _complete_task(s)\n    else: save_game(); state_changed.emit()\n    return true\n\n'''
          replace_once(path,'func treat_survivor(sid):\n',insert_game+'func treat_survivor(sid):\n')
          replace_once(path,'    elif kind == "garden":\n        garden_tended_day = day\n        add_skill_xp(s, "Technical", 2)\n        toast_requested.emit("Garden tended for Day %d." % day)\n    elif kind == "treatment":','    elif kind == "garden":\n        garden_tended_day = day\n        add_skill_xp(s, "Technical", 2)\n        toast_requested.emit("Garden tended for Day %d." % day)\n    elif kind == "chore":\n        var chore:=str(task.get("chore",""))\n        if chore=="stoke_fire": fire_level=clampf(fire_level+CampLifeRules.FIRE_MAINTAIN_GAIN,0.0,100.0)\n        elif chore=="clean_camp":\n            camp_maintenance=clampf(camp_maintenance+22.0,0.0,100.0)\n            for survivor in survivors:\n                if survivor["condition"]!="Dead" and survivor["status"] not in ["Expedition","Tactical Encounter"]:\n                    var needs:=CampLifeRules.normalize_needs(survivor.get("needs",{})); needs["hygiene"]=clampf(float(needs["hygiene"])+18.0,0.0,100.0); survivor["needs"]=needs\n        elif chore=="repair_perimeter": camp_maintenance=clampf(camp_maintenance+38.0,0.0,100.0)\n        _add_history("Day %d — %s completed camp duty: %s." % [day,s["name"],task.get("label","Chore")])\n        toast_requested.emit("%s complete." % task.get("label","Chore"))\n    elif kind == "pet_care":\n        var pet:Variant=get_pet(int(task.get("pet_id",-1)))\n        if pet!=null:\n            pet["needs"]=CampLifeRules.apply_pet_care(pet.get("needs",{}),str(task.get("action","")))\n            toast_requested.emit("%s is %s." % [pet["name"],pet_mood_label(pet).to_lower()])\n    elif kind == "treatment":')
          # Mark forced recruitment so pet rescues cannot consume the catch-up guarantee.
          replace_once(path,'        "tactical_resolved": false,\n        "special_site": "",','        "tactical_resolved": false,\n        "force_recruit": force_recruit,\n        "special_site": "",')
          # Tactical rescue candidate may be a pet.
          old='''    var rescue_candidate := {}\n    if combat_kind == "rescue":\n        rescue_candidate = _generate_survivor(false)\n        rescue_candidate["status"] = "Awaiting Rescue"\n        rescue_candidate["task"] = {}\n        rescue_candidate["stress"] = rng.randf_range(35.0, 60.0)\n        rescue_candidate["fatigue"] = rng.randf_range(15.0, 35.0)\n    current_combat = {'''
          new='''    var rescue_candidate := {}\n    var rescue_is_pet := false\n    if combat_kind == "rescue":\n        rescue_is_pet = not bool(exp.get("force_recruit",false)) and pets.size()<CampLifeRules.MAX_PETS and population()>=2 and rng.randf()<0.30\n        if rescue_is_pet:\n            rescue_candidate = _generate_pet_candidate()\n        else:\n            rescue_candidate = _generate_survivor(false)\n            rescue_candidate["status"] = "Awaiting Rescue"\n            rescue_candidate["task"] = {}\n            rescue_candidate["stress"] = rng.randf_range(35.0, 60.0)\n            rescue_candidate["fatigue"] = rng.randf_range(15.0, 35.0)\n    current_combat = {'''
          replace_once(path,old,new)
          replace_once(path,'        "rescue_candidate": rescue_candidate.duplicate(true) if combat_kind == "rescue" else {},','        "rescue_candidate": rescue_candidate.duplicate(true) if combat_kind == "rescue" else {},\n        "rescue_is_pet": rescue_is_pet,')
          # Pet rescue resolution goes straight into camp rather than recruit dialogue.
          replace_once(path,'    if kind == "rescue" and bool(result.get("rescued", false)):\n        var rescue_candidate: Dictionary = _prepare_rescue_candidate(encounter.get("rescue_candidate", {}), int(result.get("rescue_survivor_hp", 1)), int(result.get("rescue_survivor_max_hp", TacticalBalance.RESCUE_SURVIVOR_HP)))','    if kind == "rescue" and bool(result.get("rescued", false)) and bool(encounter.get("rescue_is_pet",false)):\n        var pet_candidate:Dictionary=encounter.get("rescue_candidate",{}).duplicate(true)\n        _add_pet(pet_candidate)\n        _queue_field_result(event,"%s Rescued" % str(pet_candidate.get("name","Pet")),"You get the stranded %s out of %s alive. It follows you all the way back to First Fire.%s" % [str(pet_candidate.get("species","animal")).to_lower(),place,loot_note],"A rescued pet made it back to First Fire.")\n    elif kind == "rescue" and bool(result.get("rescued", false)):\n        var rescue_candidate: Dictionary = _prepare_rescue_candidate(encounter.get("rescue_candidate", {}), int(result.get("rescue_survivor_hp", 1)), int(result.get("rescue_survivor_max_hp", TacticalBalance.RESCUE_SURVIVOR_HP)))')
          # Daily pet forage.
          replace_once(path,'    if buildings.get("Garden Plot", false) and garden_tended_day == day:\n        resources["Raw Food"] = int(resources.get("Raw Food", 0)) + 2\n','    if buildings.get("Garden Plot", false) and garden_tended_day == day:\n        resources["Raw Food"] = int(resources.get("Raw Food", 0)) + 2\n\n    for pet in pets:\n        if CampLifeRules.pet_can_forage(pet.get("needs",{})) and rng.randf()<0.35:\n            var pet_find:=CampLifeRules.pet_forage_resource(str(pet.get("species","Dog")),rng)\n            resources[pet_find]=int(resources.get(pet_find,0))+1\n            _add_history("Day %d — %s brought back 1 %s." % [day,pet.get("name","Pet"),pet_find])\n')
          # Save/load additive fields.
          replace_once(path,'        "recent_expedition_ids": recent_expedition_ids,\n        "fire_level": fire_level,','        "recent_expedition_ids": recent_expedition_ids,\n        "fire_level": fire_level, "camp_maintenance": camp_maintenance,\n        "pets": pets, "next_pet_id": next_pet_id,')
          replace_once(path,'    fire_level=clampf(float(parsed.get("fire_level",CampLifeRules.FIRE_START_LEVEL)),0.0,100.0)\n    for s in survivors:','    fire_level=clampf(float(parsed.get("fire_level",CampLifeRules.FIRE_START_LEVEL)),0.0,100.0)\n    camp_maintenance=clampf(float(parsed.get("camp_maintenance",CampLifeRules.CAMP_MAINTENANCE_START)),0.0,100.0)\n    pets=parsed.get("pets",[])\n    next_pet_id=int(parsed.get("next_pet_id",1))\n    for pet in pets: pet["needs"]=CampLifeRules.normalize_pet_needs(pet.get("needs",{}))\n    for s in survivors:')

          # Active three-stat expedition also marks forced recruitment.
          path='game/scripts/GameThreeStat.gd'
          replace_once(path,'"combat_kind": combat_kind, "combat_triggered": false, "combat_trigger_remaining": duration * rng.randf_range(0.25, 0.65), "tactical_resolved": false, "special_site": ""}','"combat_kind": combat_kind, "combat_triggered": false, "combat_trigger_remaining": duration * rng.randf_range(0.25, 0.65), "tactical_resolved": false, "force_recruit": force_recruit, "special_site": ""}')

          # Tactical pet appearance/state.
          path='game/scripts/FFCombat.gd'
          replace_once(path,'    rescuee["max_hp"] = mini(int(rescuee.get("max_hp", 18)), TacticalBalance.RESCUE_SURVIVOR_HP)\n','    rescuee["max_hp"] = 8 if bool(rescuee.get("is_pet",false)) else mini(int(rescuee.get("max_hp", 18)), TacticalBalance.RESCUE_SURVIVOR_HP)\n')
          replace_once(path,'        "id": int(s.get("id", -1)),\n        "name": str(s.get("name", "Survivor")),','        "id": int(s.get("id", -1)),\n        "name": str(s.get("name", "Survivor")),\n        "is_pet": bool(s.get("is_pet", false)),\n        "species": str(s.get("species", "")),')
          old='''    if not rescuee.is_empty() and visible_cells.has(rescuee.pos):\n        if rescuee.dead:\n            TacticalVisuals.draw_survivor_corpse(self, cell_center(rescuee.pos), rescuee)\n        else:\n            TacticalVisuals.draw_survivor(self, cell_center(rescuee.pos), rescuee, false)\n            var rescue_label := "FOLLOW" if rescue_contacted else "RESCUE"\n            draw_string(font, cell_center(rescuee.pos) + Vector2(-24, -13), rescue_label, HORIZONTAL_ALIGNMENT_CENTER, 48, 7, Color(.98, .82, .36))\n'''
          new='''    if not rescuee.is_empty() and visible_cells.has(rescuee.pos):\n        if bool(rescuee.get("is_pet",false)):\n            TacticalVisuals.draw_pet(self,cell_center(rescuee.pos),rescuee,bool(rescuee.dead))\n        elif rescuee.dead:\n            TacticalVisuals.draw_survivor_corpse(self, cell_center(rescuee.pos), rescuee)\n        else:\n            TacticalVisuals.draw_survivor(self, cell_center(rescuee.pos), rescuee, false)\n        if not rescuee.dead:\n            var rescue_label := "FOLLOW" if rescue_contacted else ("PET" if bool(rescuee.get("is_pet",false)) else "RESCUE")\n            draw_string(font, cell_center(rescuee.pos) + Vector2(-24, -13), rescue_label, HORIZONTAL_ALIGNMENT_CENTER, 48, 7, Color(.98, .82, .36))\n'''
          replace_once(path,old,new)

          path='game/scripts/FFTacticalVisuals.gd'
          marker='\nstatic func draw_zombie(canvas: CanvasItem, center: Vector2, zombie: Dictionary) -> void:'
          petdraw='''\nstatic func draw_pet(canvas:CanvasItem,center:Vector2,actor:Dictionary,dead:=false)->void:\n    var species:=str(actor.get("species","Dog"))\n    var body:=Color("9a704b") if species=="Dog" else Color("8a9296")\n    if dead: body=Color(body.r*0.45,body.g*0.45,body.b*0.45,0.75)\n    canvas.draw_circle(center+Vector2(-1,2),7.0,body)\n    canvas.draw_circle(center+Vector2(5,-3),5.0,body)\n    if species=="Cat":\n        canvas.draw_colored_polygon(PackedVector2Array([center+Vector2(2,-7),center+Vector2(4,-13),center+Vector2(6,-7)]),body)\n        canvas.draw_colored_polygon(PackedVector2Array([center+Vector2(6,-7),center+Vector2(10,-12),center+Vector2(10,-5)]),body)\n        canvas.draw_line(center+Vector2(-7,1),center+Vector2(-12,-5),body,2.0)\n    else:\n        canvas.draw_circle(center+Vector2(2,-6),2.5,Color(body.r*0.72,body.g*0.72,body.b*0.72))\n        canvas.draw_line(center+Vector2(-7,1),center+Vector2(-11,-2),body,2.5)\n    canvas.draw_circle(center+Vector2(7,-4),1.0,Color("161616"))\n    canvas.draw_circle(center,11.5,Color(.96,.72,.24,.72),false,1.4)\n    if dead:\n        canvas.draw_line(center+Vector2(-5,-5),center+Vector2(5,5),Color(.55,.12,.10,.9),2.0)\n        canvas.draw_line(center+Vector2(5,-5),center+Vector2(-5,5),Color(.55,.12,.10,.9),2.0)\n'''
          p=Path(path); tt=p.read_text();
          if marker not in tt: raise SystemExit('visual marker missing')
          p.write_text(tt.replace(marker,petdraw+marker,1))

          # Camp UI work board + Tamagotchi-style pet cards.
          path='game/scripts/Main.gd'
          replace_once(path,'    content_box.add_child(_separator())\n    content_box.add_child(_heading("Leadership", 19))','    _draw_camp_work_board()\n\n    content_box.add_child(_separator())\n    content_box.add_child(_heading("Leadership", 19))')
