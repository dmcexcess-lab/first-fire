name: One-time First Fire source razor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: first-fire-razor
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Godot 4.7 strict inference exposed by startup smoke
        shell: bash
        run: |
          set -euxo pipefail
          test -f game/scripts/FFCombat.gd
          python3 - <<'PY'
          from pathlib import Path
          path = Path("game/scripts/FFCombat.gd")
          text = path.read_text()
          replacements = [
              (
                  '    var count := {"Camp Perimeter": 3, "Nearby Streets": 4, "Residential Blocks": 5, "Commercial Fringe": 6, "Industrial Edge": 7}.get(zone, 4)',
                  '    var count: int = int({"Camp Perimeter": 3, "Nearby Streets": 4, "Residential Blocks": 5, "Commercial Fringe": 6, "Industrial Edge": 7}.get(zone, 4))',
              ),
              ('    var dmg := max(2, 13 - d * 4)', '    var dmg: int = maxi(2, 13 - d * 4)'),
              ('    var x := clamp(ideal_x, SCREEN_W - map_width, 0.0)', '    var x: float = clampf(ideal_x, SCREEN_W - map_width, 0.0)'),
          ]
          changed = False
          for old, new in replacements:
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new)
                  changed = True
              elif new in text:
                  # Idempotent if this temporary workflow runs once more before deletion.
                  continue
              else:
                  raise SystemExit(f"Expected FFCombat line not found: {old}")
          if changed:
              path.write_text(text)
          PY

          grep -q 'var count: int = int(' game/scripts/FFCombat.gd
          grep -q 'var dmg: int = maxi(' game/scripts/FFCombat.gd
          grep -q 'var x: float = clampf(' game/scripts/FFCombat.gd
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/scripts/FFCombat.gd
          if git diff --cached --quiet; then
            echo "Strict-inference fixes already present."
            exit 0
          fi
          git commit -m "Fix strict Godot combat type inference"
          git push origin HEAD:main
