name: Temporary tactical survivor rescue integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply survivor rescue tactical pass
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'Physical Survivor Rescue' CHANGELOG.md; then
            echo 'Rescue tactical pass already applied.'
            exit 0
          fi
          test -f .github/scripts/temp_rescue_tactical_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/temp_rescue_tactical_patch.py')
          s = p.read_text()
          old = '''text = replace_once(text, '    if blocked(dest) or zombie_at(dest) != -1 or ally_at(dest):\\n', '    if blocked(dest) or zombie_at(dest) != -1 or ally_at(dest) or rescuee_at(dest):\\n', 'backward rescuee collision')
          text = replace_once(text, '    if blocked(dest) or zombie_at(dest) != -1 or ally_at(dest):\\n', '    if blocked(dest) or zombie_at(dest) != -1 or ally_at(dest) or rescuee_at(dest):\\n', 'forward rescuee collision')'''
          new = '''collision_old = '    if blocked(dest) or zombie_at(dest) != -1 or ally_at(dest):\\n'
          collision_new = '    if blocked(dest) or zombie_at(dest) != -1 or ally_at(dest) or rescuee_at(dest):\\n'
          if text.count(collision_old) != 2:
              raise SystemExit(f'COLLISION PATH COUNT: {text.count(collision_old)}')
          text = text.replace(collision_old, collision_new, 2)'''
          if old not in s:
              raise SystemExit('collision transform patch source not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 .github/scripts/temp_rescue_tactical_patch.py | tee /tmp/rescue-tactical.log
          grep -q 'FIRST_FIRE_RESCUE_TACTICAL_PATCH_OK' /tmp/rescue-tactical.log
          grep -q 'func contact_rescuee' game/scripts/FFCombat.gd
          grep -q 'rescue_candidate' game/scripts/Game.gd
          grep -q 'starting zone rescue tactical option' game/scripts/ci/FFArchitectureSmoke.gd
          test ! -e .github/scripts/temp_rescue_tactical_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/scripts/FFTacticalScenarios.gd game/scripts/FFTacticalBalance.gd game/scripts/FFCombat.gd game/scripts/Game.gd game/scripts/ci/FFArchitectureSmoke.gd README_CONTEXT.md ARCHITECTURE.md CHANGELOG.md .github/scripts/temp_rescue_tactical_patch.py
          git commit -m 'Add physical tactical survivor rescues'
          git push origin HEAD:main
