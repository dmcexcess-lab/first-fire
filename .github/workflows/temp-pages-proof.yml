name: Temporary exact Pages proof

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for cleanup SHA and prove its permanent Pages run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api() {
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          cleanup_sha=""
          for i in $(seq 1 30); do
            cleanup_sha=$(api "https://api.github.com/repos/$REPO/git/ref/heads/main" | jq -r '.object.sha')
            if [ -n "$cleanup_sha" ] && [ "$cleanup_sha" != "$TRIGGER_SHA" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$cleanup_sha" ] || [ "$cleanup_sha" = "$TRIGGER_SHA" ]; then
            echo "Cleanup SHA never appeared."
            exit 1
          fi
          echo "Proving Pages for cleanup SHA $cleanup_sha"

          run_id=""
          conclusion=""
          for i in $(seq 1 90); do
            runs=$(api "https://api.github.com/repos/$REPO/actions/runs?head_sha=$cleanup_sha&event=push&per_page=20")
            run_id=$(printf '%s' "$runs" | jq -r '.workflow_runs[] | select(.path == ".github/workflows/pages.yml") | .id' | head -n1)
            if [ -n "$run_id" ]; then
              status=$(printf '%s' "$runs" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status')
              conclusion=$(printf '%s' "$runs" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | (.conclusion // "")')
              echo "Pages run $run_id: $status $conclusion"
              if [ "$status" = "completed" ]; then
                break
              fi
            fi
            sleep 4
          done

          if [ -z "$run_id" ] || [ "$conclusion" != "success" ]; then
            echo "Permanent Pages run did not succeed."
            exit 1
          fi

          payload=$(jq -nc --arg target "https://github.com/$REPO/actions/runs/$run_id" '{state:"success", target_url:$target, description:"Exact main SHA passed permanent Pages CI/deploy", context:"first-fire/pages-proof"}')
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload" \
            "https://api.github.com/repos/$REPO/statuses/$cleanup_sha" >/dev/null
          echo "PAGES_PROOF_OK $cleanup_sha $run_id"
