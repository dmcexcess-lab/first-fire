name: Temporary tactical map depth patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-tactical-map-depth.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tactical maps, loot, balance, and rescue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          # --- Tactical environments: far extraction routes + authored physical loot containers.
          path = Path('game/scripts/FFTacticalEnvironments.gd')
          text = path.read_text()
          text = text.replace('        "lights": [],\n        "player_spawn": player_spawn,', '        "lights": [],\n        "loot_containers": [],\n        "player_spawn": player_spawn,', 1)
          text = text.replace('static func _light(spec: Dictionary, p: Vector2i, light_kind: String, requires_power := true) -> void:\n    spec["lights"].append([p, light_kind, requires_power])\n', 'static func _light(spec: Dictionary, p: Vector2i, light_kind: String, requires_power := true) -> void:\n    spec["lights"].append([p, light_kind, requires_power])\n\nstatic func _loot(spec: Dictionary, p: Vector2i, container_kind: String) -> void:\n    spec["loot_containers"].append([p, container_kind])\n', 1)
          text = text.replace('    for exit_cell in exits:\n        if not _inside(exit_cell) or blocked.has(exit_cell):\n            return false\n', '    for exit_cell in exits:\n        if not _inside(exit_cell) or blocked.has(exit_cell):\n            return false\n        if _layout_path_distance(spec, spawn, exit_cell) < 8:\n            return false\n    for entry_value in spec.get("loot_containers", []):\n        var loot_entry: Array = entry_value\n        if loot_entry.size() < 2:\n            return false\n        var loot_pos: Vector2i = loot_entry[0]\n        if not _inside(loot_pos) or (not spec.get("obstacles", []).has(loot_pos) and not _spec_has_prop_at(spec, loot_pos)):\n            return false\n', 1)
          marker = 'static func _inside(p: Vector2i) -> bool:\n    return p.x >= 1 and p.y >= 1 and p.x < BOARD_W - 1 and p.y < BOARD_H - 1\n'
          extra = '''static func _layout_path_distance(spec: Dictionary, start: Vector2i, goal: Vector2i) -> int:\n    var distances := {start: 0}\n    var queue: Array = [start]\n    while not queue.is_empty():\n        var p: Vector2i = queue.pop_front()\n        if p == goal:\n            return int(distances[p])\n        for d in [Vector2i(0,-1), Vector2i(1,0), Vector2i(0,1), Vector2i(-1,0)]:\n            var n: Vector2i = p + d\n            if not _inside(n) or spec.get("walls", []).has(n) or spec.get("obstacles", []).has(n) or distances.has(n):\n                continue\n            distances[n] = int(distances[p]) + 1\n            queue.append(n)\n    return -1\n\nstatic func minimum_exit_distance(spec: Dictionary) -> int:\n    var spawn: Vector2i = spec.get("player_spawn", Vector2i(-1, -1))\n    var best := 999\n    for exit_cell in spec.get("exit_cells", []):\n        var distance := _layout_path_distance(spec, spawn, exit_cell)\n        if distance >= 0:\n            best = mini(best, distance)\n    return -1 if best == 999 else best\n\nstatic func _spec_has_prop_at(spec: Dictionary, p: Vector2i) -> bool:\n    for entry_value in spec.get("props", []):\n        var entry: Array = entry_value\n        if entry.size() >= 2 and entry[0] == p:\n            return true\n    return false\n\n'''
          if marker not in text: raise SystemExit('inside marker missing')
          text = text.replace(marker, extra + marker, 1)

          # Far-side exits. Escape should require crossing/reading the map rather than spawning beside extraction.
          text = text.replace('    var exits: Array = [Vector2i(9, 16)]\n    if variant == 1:\n        exits.append(Vector2i(10, 1))\n    var spec := _spec("asphalt", Vector2i(9, 14), Vector2i(8, 14), exits)', '    var exits: Array = [Vector2i(10, 1)]\n    var spec := _spec("asphalt", Vector2i(9, 14), Vector2i(8, 14), exits)', 1)
          text = text.replace('    var exits: Array = [Vector2i(2, 16), Vector2i(17, 16)]\n    if variant == 1:\n        exits.append(Vector2i(1, 11))\n    var spec := _spec("asphalt", Vector2i(4, 14), Vector2i(5, 14), exits)', '    var exits: Array = [Vector2i(17, 16)]\n    var spec := _spec("asphalt", Vector2i(4, 14), Vector2i(5, 14), exits)', 1)
          text = text.replace('    var exits: Array = [Vector2i(10, 15)]\n    if variant == 1:\n        exits.append(Vector2i(15, 1))\n    var spec := _spec("grass", Vector2i(10, 12), Vector2i(11, 12), exits)', '    var exits: Array = [Vector2i(15, 1)]\n    var spec := _spec("grass", Vector2i(10, 12), Vector2i(11, 12), exits)', 1)
          text = text.replace('    if variant == 1:\n        _door(spec, Vector2i(15, 2), false)\n', '    _door(spec, Vector2i(15, 2), false)\n', 1)
          text = text.replace('    var exits: Array = [Vector2i(9, 15)]\n    if variant == 1:\n        exits.append(Vector2i(17, 8))\n    var spec := _spec("sidewalk", Vector2i(9, 13), Vector2i(10, 13), exits)', '    var exits: Array = [Vector2i(17, 8)]\n    var spec := _spec("sidewalk", Vector2i(9, 13), Vector2i(10, 13), exits)', 1)
          text = text.replace('    if variant == 1:\n        _door(spec, Vector2i(17, 8), false)\n', '    _door(spec, Vector2i(17, 8), false)\n', 1)
          text = text.replace('    var exits: Array = [Vector2i(10, 15)]\n    if variant == 1:\n        exits.append(Vector2i(18, 7))\n    var spec := _spec("sidewalk", Vector2i(10, 12), Vector2i(9, 12), exits)', '    var exits: Array = [Vector2i(18, 7)]\n    var spec := _spec("sidewalk", Vector2i(10, 12), Vector2i(9, 12), exits)', 1)
          text = text.replace('    if variant == 1:\n        _door(spec, Vector2i(18, 7), false)\n', '    _door(spec, Vector2i(18, 7), false)\n', 1)
          text = text.replace('    var exits: Array = [Vector2i(2, 16), Vector2i(17, 16)]\n    if variant == 1:\n        exits.append(Vector2i(1, 8))\n    var spec := _spec("concrete", Vector2i(4, 14), Vector2i(5, 14), exits)', '    var exits: Array = [Vector2i(17, 16)]\n    var spec := _spec("concrete", Vector2i(4, 14), Vector2i(5, 14), exits)', 1)
          text = text.replace('    var exits: Array = [Vector2i(9, 16)]\n    if variant == 1:\n        exits.append(Vector2i(10, 1))\n    var spec := _spec("dirt", Vector2i(9, 14), Vector2i(10, 14), exits)', '    var exits: Array = [Vector2i(10, 1)]\n    var spec := _spec("dirt", Vector2i(9, 14), Vector2i(10, 14), exits)', 1)

          # Searchable physical fixtures in every authored place.
          text = text.replace('    _obstacle(spec, Vector2i(12, 4), "trash")\n', '    _obstacle(spec, Vector2i(12, 4), "trash")\n    _loot(spec, Vector2i(5, 5), "dumpster")\n    _loot(spec, Vector2i(13, 11), "dumpster")\n    _loot(spec, Vector2i(12, 4), "trash")\n', 1)
          text = text.replace('    _obstacle(spec, Vector2i(10, 10), "ice_box")\n', '    _obstacle(spec, Vector2i(10, 10), "ice_box")\n    _loot(spec, Vector2i(3, 9), "car")\n    _loot(spec, Vector2i(16, 4), "shelf")\n    _loot(spec, Vector2i(10, 10), "ice_box")\n', 1)
          text = text.replace('    _obstacle(spec, Vector2i(16, 6), "fridge")\n', '    _obstacle(spec, Vector2i(16, 6), "fridge")\n    _loot(spec, Vector2i(16, 6), "fridge")\n    _loot(spec, Vector2i(14, 4), "cabinet")\n    _loot(spec, Vector2i(14, 11), "cabinet")\n', 1)
          text = text.replace('    _obstacle(spec, Vector2i(16, 6), "washer")\n', '    _obstacle(spec, Vector2i(16, 6), "washer")\n    _obstacle(spec, Vector2i(5, 6), "crate")\n    _obstacle(spec, Vector2i(15, 11), "crate")\n    _loot(spec, Vector2i(16, 6), "washer")\n    _loot(spec, Vector2i(5, 6), "crate")\n    _loot(spec, Vector2i(15, 11), "crate")\n', 1)
          text = text.replace('    _obstacle(spec, Vector2i(17, 11), "vending")\n', '    _obstacle(spec, Vector2i(17, 11), "vending")\n    _loot(spec, Vector2i(8, 5), "shelf")\n    _loot(spec, Vector2i(12, 6), "shelf")\n    _loot(spec, Vector2i(17, 11), "vending")\n', 1)
          text = text.replace('    spec["barrels"].append(Vector2i(12, 8))\n', '    _loot(spec, Vector2i(13, 5), "crate")\n    _loot(spec, Vector2i(14, 12), "crate")\n    _loot(spec, Vector2i(15, 12), "crate")\n    spec["barrels"].append(Vector2i(12, 8))\n', 1)
          text = text.replace('    _obstacle(spec, Vector2i(11, 6), "culvert_debris")\n', '    _obstacle(spec, Vector2i(11, 6), "culvert_debris")\n    _obstacle(spec, Vector2i(10, 11), "crate")\n    _loot(spec, Vector2i(8, 8), "cart")\n    _loot(spec, Vector2i(11, 6), "debris")\n    _loot(spec, Vector2i(10, 11), "crate")\n', 1)
          path.write_text(text)

          # --- Tactical balance: fewer better-placed infected, mass-aware HP, and container loot math.
          path = Path('game/scripts/FFTacticalBalance.gd')
          text = path.read_text()
          text = text.replace('class_name FFTacticalBalance\n\n# Beta tuning owner', 'class_name FFTacticalBalance\n\nconst D = preload("res://scripts/FFData.gd")\n\n# Beta tuning owner', 1)
          text = text.replace('const EXPLORE_SITE_COUNTS := {\n    "Camp Perimeter": 3,\n    "Nearby Streets": 3,\n    "Residential Blocks": 4,\n    "Commercial Fringe": 4,\n    "Industrial Edge": 5,\n}', 'const EXPLORE_SITE_COUNTS := {\n    "Camp Perimeter": 3,\n    "Nearby Streets": 3,\n    "Residential Blocks": 3,\n    "Commercial Fringe": 3,\n    "Industrial Edge": 3,\n}', 1)
          text = text.replace('const ZOMBIE_BASE_COUNTS := {\n    "Camp Perimeter": 3,\n    "Nearby Streets": 4,\n    "Residential Blocks": 5,\n    "Commercial Fringe": 6,\n    "Industrial Edge": 7,\n}\n\nconst RESCUE_SURVIVOR_HP := 12\nconst RESCUE_CONTACT_TICKS := 70\nconst RESCUE_PACE_PENALTY := 18', 'const ZOMBIE_BASE_COUNTS := {\n    "Camp Perimeter": 2,\n    "Nearby Streets": 3,\n    "Residential Blocks": 4,\n    "Commercial Fringe": 5,\n    "Industrial Edge": 6,\n}\n\nconst RESCUE_SURVIVOR_HP := 14\nconst RESCUE_CONTACT_TICKS := 55\nconst RESCUE_PACE_PENALTY := 12\n\nconst CONTAINER_BIASES := {\n    "fridge": {"Raw Food": 18, "Dirty Water": 10, "Clean Water": 6},\n    "ice_box": {"Raw Food": 14, "Dirty Water": 10, "Clean Water": 5},\n    "shelf": {"Raw Food": 8, "Plastic": 8, "Cloth": 5, "Medicine": 2},\n    "vending": {"Raw Food": 8, "Dirty Water": 12, "Plastic": 5},\n    "cabinet": {"Cloth": 8, "Plastic": 7, "Hardware": 5, "Medicine": 2},\n    "crate": {"Scrap Metal": 12, "Hardware": 10, "Plastic": 7, "Cloth": 5},\n    "washer": {"Cloth": 14, "Hardware": 4, "Plastic": 4},\n    "car": {"Scrap Metal": 9, "Hardware": 8, "Cloth": 5, "Ammo": 2},\n    "dumpster": {"Scrap Metal": 9, "Plastic": 9, "Cloth": 7, "Wood": 5},\n    "trash": {"Plastic": 10, "Cloth": 7, "Scrap Metal": 5},\n    "cart": {"Scrap Metal": 7, "Cloth": 6, "Plastic": 5},\n    "debris": {"Scrap Metal": 10, "Wood": 8, "Hardware": 5},\n}', 1)
          text = text.replace('    if kind in ["explore", "rescue"]:\n        count -= 1\n    elif kind == "ambush":\n        count += 1\n', '    if kind == "rescue":\n        count -= 1\n    elif kind == "ambush":\n        count += 1\n', 1)
          insert_after = 'static func explore_reward_rolls(searches: int, unused_skill: int = 0) -> int:\n    if searches <= 0:\n        return 0\n    var rolls := 1\n    if searches >= 3: rolls += 1\n    if searches >= 5: rolls += 1\n    return clampi(rolls, 1, 3)\n'
          extra = '''\nstatic func zombie_hp_range(mass: String) -> Vector2i:\n    if mass == "LIGHT": return Vector2i(7, 10)\n    if mass == "HEAVY": return Vector2i(12, 16)\n    return Vector2i(9, 13)\n\nstatic func container_label(container_kind: String) -> String:\n    match container_kind:\n        "ice_box": return "ice box"\n        "dumpster": return "dumpster"\n        "trash": return "trash pile"\n        "car": return "car"\n        "shelf": return "shelf"\n        "fridge": return "fridge"\n        "cabinet": return "cabinet"\n        "crate": return "crate"\n        "washer": return "washer"\n        "vending": return "vending machine"\n        "cart": return "shopping cart"\n        "debris": return "debris cache"\n        _: return "container"\n\nstatic func container_search_cost(actor: Dictionary) -> int:\n    var fatigue := clampf(float(actor.get("fatigue", 0.0)), 0.0, 100.0)\n    return clampi(int(round(78.0 + fatigue * 0.16)), 72, 104)\n\nstatic func container_search_noise(container_kind: String) -> int:\n    if container_kind in ["dumpster", "debris", "car"]: return 26\n    if container_kind in ["crate", "washer"]: return 22\n    return 17\n\nstatic func roll_container_loot(zone: String, container_kind: String, rng: RandomNumberGenerator) -> Dictionary:\n    var zone_data: Dictionary = D.ZONES.get(zone, D.ZONES["Nearby Streets"])\n    var weights: Dictionary = zone_data.get("loot", {}).duplicate(true)\n    var bias: Dictionary = CONTAINER_BIASES.get(container_kind, {})\n    for key in bias.keys():\n        weights[key] = int(weights.get(key, 0)) + int(bias[key])\n    var rolls := 1\n    if rng.randf() < 0.38:\n        rolls += 1\n    if zone in ["Commercial Fringe", "Industrial Edge"] and rng.randf() < 0.22:\n        rolls += 1\n    var found: Dictionary = {}\n    for _roll in range(rolls):\n        var key := _weighted_pick(weights, rng)\n        if key != "":\n            found[key] = int(found.get(key, 0)) + 1\n    return found\n\nstatic func _weighted_pick(weights: Dictionary, rng: RandomNumberGenerator) -> String:\n    var total := 0\n    for key in weights.keys():\n        total += maxi(0, int(weights[key]))\n    if total <= 0:\n        return ""\n    var roll := rng.randi_range(1, total)\n    var running := 0\n    for key in weights.keys():\n        running += maxi(0, int(weights[key]))\n        if roll <= running:\n            return str(key)\n    return ""\n'''
          if insert_after not in text: raise SystemExit('balance insertion anchor missing')
          text = text.replace(insert_after, insert_after + extra, 1)
          path.write_text(text)

          # --- Core tactical runtime: physical containers, safer Rescue opening phase, clearer routing.
          path = Path('game/scripts/FFCombat.gd')
          text = path.read_text()
          text = text.replace('var explore_gear_cell := Vector2i(-1, -1)\nvar game_over := false', 'var explore_gear_cell := Vector2i(-1, -1)\nvar loot_containers := {}\nvar looted_containers := {}\nvar container_contents := {}\nvar game_over := false', 1)
          text = text.replace('"searches": 0, "noise": 0, "damage": 0}', '"searches": 0, "containers": 0, "noise": 0, "damage": 0}')
          text = text.replace('    walls.clear(); obstacles.clear(); glass.clear(); doors.clear(); barrels.clear(); props.clear(); ground.clear(); indoor_cells.clear(); opaque_obstacles.clear(); exit_cells.clear(); light_sources.clear(); light_levels.clear(); light_tints.clear()', '    walls.clear(); obstacles.clear(); glass.clear(); doors.clear(); barrels.clear(); props.clear(); ground.clear(); indoor_cells.clear(); opaque_obstacles.clear(); exit_cells.clear(); light_sources.clear(); light_levels.clear(); light_tints.clear(); loot_containers.clear(); looted_containers.clear(); container_contents.clear()', 1)
          load_anchor = '    for p in obstacles.keys():\n        if not props.has(p): opaque_obstacles[p] = true\n'
          load_extra = '''    for entry_value in spec.get("loot_containers", []):\n        var loot_entry: Array = entry_value\n        if loot_entry.size() < 2:\n            continue\n        var loot_pos: Vector2i = loot_entry[0]\n        var container_kind := str(loot_entry[1])\n        loot_containers[loot_pos] = container_kind\n        container_contents[loot_pos] = TacticalBalance.roll_container_loot(str(context.get("zone", "Nearby Streets")), container_kind, rng)\n'''
          if load_anchor not in text: raise SystemExit('combat loot load anchor missing')
          text = text.replace(load_anchor, load_anchor + load_extra, 1)
          old_intro = '''    if context.get("kind", "ambush") == "rescue":\n        var rescue_name := str(rescuee.get("name", "the survivor"))\n        msg = "Reach %s, then get both of you out." % rescue_name\n        submsg = "They cannot fight. Once contacted, they will stay close and can be hurt."\n    elif context.get("kind", "ambush") == "explore":\n        var field_gear := str(context.get("field_gear", "Field Loot"))\n        msg = "Search the marked spots for %s." % field_gear\n        submsg = "Each search takes time and makes noise. Leave whenever survival matters more."\n    else:\n        msg = "You got jumped. Break contact and escape."\n        submsg = "You do not need to kill anything."\n'''
          new_intro = '''    if context.get("kind", "ambush") == "rescue":\n        var rescue_name := str(rescuee.get("name", "the survivor"))\n        msg = "Reach %s at the marked SOS, then escort them out." % rescue_name\n        submsg = "They are protected until contact. After contact they can be hurt."\n    elif context.get("kind", "ambush") == "explore":\n        var field_gear := str(context.get("field_gear", "Field Loot"))\n        msg = "Open the marked containers and find %s." % field_gear\n        submsg = "Containers hold real supplies; loot only comes home if you escape."\n    else:\n        msg = "You got jumped. Reach the marked exit."\n        submsg = "Extraction is across the map. Pick a route; killing everything is optional."\n'''
          if old_intro not in text: raise SystemExit('combat intro block missing')
          text = text.replace(old_intro, new_intro, 1)

          old_setup = re.search(r'func setup_explore_sites\(\) -> void:.*?\nfunc spawn_zombies\(\):', text, re.S)
          if not old_setup: raise SystemExit('explore setup block missing')
          new_setup = '''func setup_explore_sites() -> void:\n    explore_cells.clear()\n    explore_searched.clear()\n    explore_gear_cell = Vector2i(-1, -1)\n    if str(context.get("kind", "ambush")) != "explore":\n        return\n    var wanted := mini(TacticalBalance.explore_site_count(str(context.get("zone", "Nearby Streets"))), loot_containers.size())\n    explore_cells = choose_explore_containers(wanted)\n    if explore_cells.is_empty():\n        explore_cells = loot_containers.keys().slice(0, wanted)\n    if explore_cells.is_empty():\n        return\n    explore_gear_cell = explore_cells[rng.randi_range(0, explore_cells.size() - 1)]\n    objective_cell = explore_gear_cell\n\nfunc _reachable_distances(start: Vector2i) -> Dictionary:\n    var distances := {start: 0}\n    var queue: Array = [start]\n    while not queue.is_empty():\n        var p: Vector2i = queue.pop_front()\n        for d in DIRS:\n            var n: Vector2i = p + Vector2i(d)\n            if not inside(n) or walls.has(n) or obstacles.has(n) or distances.has(n):\n                continue\n            distances[n] = int(distances[p]) + 1\n            queue.append(n)\n    return distances\n\nfunc _container_approach_distance(cell: Vector2i, distances: Dictionary) -> int:\n    var best := 999\n    for d in DIRS:\n        var adjacent := cell + Vector2i(d)\n        if distances.has(adjacent):\n            best = mini(best, int(distances[adjacent]) + 1)\n    return best\n\nfunc choose_explore_containers(wanted: int) -> Array:\n    var distances := _reachable_distances(player_spawn)\n    var preferred: Array = []\n    var fallback: Array = []\n    for key in loot_containers.keys():\n        var cell: Vector2i = key\n        var distance := _container_approach_distance(cell, distances)\n        if distance == 999:\n            continue\n        fallback.append(cell)\n        if distance >= 5:\n            preferred.append(cell)\n    var source: Array = preferred if preferred.size() >= wanted else fallback\n    var result: Array = []\n    var pool: Array = source.duplicate()\n    while not pool.is_empty() and result.size() < wanted:\n        var eligible: Array = []\n        for cell in pool:\n            var spaced := true\n            for chosen in result:\n                if manhattan(cell, chosen) < 4:\n                    spaced = false\n                    break\n            if spaced:\n                eligible.append(cell)\n        if eligible.is_empty():\n            eligible = pool\n        var choice: Vector2i = eligible[rng.randi_range(0, eligible.size() - 1)]\n        result.append(choice)\n        pool.erase(choice)\n    return result\n\nfunc spawn_zombies():'''
          text = text[:old_setup.start()] + new_setup + text[old_setup.end():]

          old_spawn = re.search(r'func spawn_zombies\(\):.*?\nfunc restore_runtime\(\):', text, re.S)
          if not old_spawn: raise SystemExit('spawn block missing')
          new_spawn = '''func spawn_zombies():\n    zombies.clear()\n    var zone := str(context.get("zone", "Nearby Streets"))\n    var kind := str(context.get("kind", "ambush"))\n    var count: int = TacticalBalance.zombie_count(zone, kind)\n    var candidates := []\n    for y in range(1, H - 1):\n        for x in range(1, W - 1):\n            var p := Vector2i(x, y)\n            if blocked(p) or p == player.get("pos", player_spawn) or p == ally.get("pos", Vector2i(-1,-1)) or rescuee_at(p) or explore_cells.has(p) or exit_cells.has(p):\n                continue\n            var near_exit := false\n            for exit_cell in exit_cells:\n                if manhattan(p, exit_cell) <= 2:\n                    near_exit = true\n                    break\n            if near_exit:\n                continue\n            var d := manhattan(player_spawn, p)\n            if kind == "ambush":\n                if d >= 5 and d <= 12: candidates.append(p)\n            elif kind == "rescue":\n                if d >= 7 and manhattan(rescue_cell, p) >= 5: candidates.append(p)\n            elif d >= 7:\n                var near_search := false\n                for search_cell in explore_cells:\n                    if manhattan(p, search_cell) <= 2:\n                        near_search = true\n                        break\n                if not near_search:\n                    candidates.append(p)\n    for i in range(count):\n        if candidates.is_empty(): break\n        var pick := rng.randi_range(0, candidates.size() - 1)\n        var p: Vector2i = candidates[pick]\n        candidates.remove_at(pick)\n        var state := "INVESTIGATE" if kind == "ambush" and i < 2 else "IDLE"\n        var look: Dictionary = TacticalVisuals.zombie_appearance(rng, zone)\n        var timing: Dictionary = TacticalTime.zombie_profile(rng, look)\n        var mass := str(timing.get("mass", "MED"))\n        var hp_range := TacticalBalance.zombie_hp_range(mass)\n        zombies.append({\n            "id": i, "pos": p, "facing": DIRS[rng.randi_range(0,3)],\n            "hp": rng.randi_range(hp_range.x, hp_range.y), "state": state,\n            "target": player_spawn if state == "INVESTIGATE" else Vector2i(-1,-1),\n            "heard": player_spawn if state == "INVESTIGATE" else Vector2i(-1,-1),\n            "pace": int(timing.get("pace", 125)), "attack_cost": int(timing.get("attack_cost", 135)), "mass": mass,\n            "next": rng.randi_range(45, int(timing.get("pace", 125))), "dead": false,\n            "look": look\n        })\n\nfunc restore_runtime():'''
          text = text[:old_spawn.start()] + new_spawn + text[old_spawn.end():]

          # Restore/persist physical container state.
          restore_anchor = '    player_light_on = bool(runtime.get("player_light_on", true))\n'
