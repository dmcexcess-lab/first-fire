name: Temporary moodlet type fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply type fix and remove temporary integration
        run: |
          set -euxo pipefail
          python .github/scripts/temp_moodlet_type_fix.py
          rm .github/scripts/temp_moodlet_type_fix.py
          rm .github/workflows/temp-moodlet-type-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix camp moodlet type inference"
          git push origin HEAD:main
