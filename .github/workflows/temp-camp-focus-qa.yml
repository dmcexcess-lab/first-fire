name: Temporary camp focus live QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-camp-focus-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Exercise live focused camp
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('qa', {recursive:true});
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const logs=[];
          page.on('console', m=>logs.push(`console:${m.type()}:${m.text()}`));
          page.on('pageerror', e=>logs.push(`pageerror:${e.message}`));
          await page.goto('https://dmcexcess-lab.github.io/first-fire/', {waitUntil:'load', timeout:120000});
          await page.waitForTimeout(9000);
          const canvas = page.locator('canvas').first();
          if(!(await canvas.boundingBox())) throw new Error('Godot canvas missing');
          async function shot(name){await page.screenshot({path:`qa/${name}.png`,fullPage:true});}
          async function clickGame(x,y,wait=700){const b=await canvas.boundingBox();await page.mouse.click(b.x+(x/390)*b.width,b.y+(y/844)*b.height);await page.waitForTimeout(wait);}
          async function dragGame(x1,y1,x2,y2,wait=700){const b=await canvas.boundingBox();const ax=b.x+(x1/390)*b.width, ay=b.y+(y1/844)*b.height;const bx=b.x+(x2/390)*b.width, by=b.y+(y2/844)*b.height;await page.mouse.move(ax,ay);await page.mouse.down();await page.mouse.move(bx,by,{steps:12});await page.mouse.up();await page.waitForTimeout(wait);}
          await clickGame(195,354,1000); // new game
          await clickGame(93,524,800);   // skip tutorial
          await shot('01_home_zoomed.png');
          await dragGame(310,430,90,430,800);
          await shot('02_home_panned_right.png');
          await dragGame(90,430,310,430,800);
          await shot('03_home_recentered.png');
          // Work board is near the left-middle of the initial centered camp.
          await clickGame(43,365,800);
          await shot('04_work_board_initial.png');
          // Return to camp from contextual sheet.
          await clickGame(195,390,700);
          // Gate sits near the lower-middle of the initial centered camp.
          await clickGame(130,675,900);
          await shot('05_gate_flat.png');
          fs.writeFileSync('qa/console.txt',logs.join('\n'));
          await browser.close();
          EOF
          node qa.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp-focus-live-qa
          path: qa
          retention-days: 1
